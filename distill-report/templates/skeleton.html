<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>

<!--THREEJS-->  <!-- three.js r128 global build; injected by `assemble.py --three` when a topic needs real 3D (depth-sort + hand-rolled drag-to-rotate) -->>

<style>
:root {
  /* surface + ink */
  --bg:        #fbfbfd;
  --surface:   #ffffff;
  --surface-2: #f4f5f8;
  --ink:       #16181d;
  --ink-soft:  #3a3f4b;
  --ink-faint: #6b7280;
  --rule:      #e3e6ec;
  --rule-2:    #cdd2dc;
  /* brand accent */
  --accent:    #3b5bdb;   /* deepdive blue */
  --accent-2:  #0c8599;   /* teal */
  /* semantic callouts */
  --insight:   #3b5bdb;
  --danger:    #e03131;
  --success:   #2f9e44;
  --warning:   #e8a000;
  --key:       #7048e8;
  --code-bg:   #f4f5f8;
  --code-fg:   #1a1c22;
  /* === per-topic VARIABLE colors — generation agents extend this block AND mirror into JS `C` === */
  --v1: #e03131; --v2: #3b5bdb; --v3: #2f9e44; --v4: #7048e8; --v5: #e8a000;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 17px; line-height: 1.72;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

/* scroll progress */
#progress { position: fixed; top: 0; left: 0; height: 3px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); z-index: 100; transition: width .1s; }

/* scroll-spy nav */
#spy { position: fixed; top: 50%; right: 18px; transform: translateY(-50%); z-index: 90;
  display: flex; flex-direction: column; gap: 10px; }
#spy a { width: 10px; height: 10px; border-radius: 50%; background: var(--rule-2); position: relative; }
#spy a.active { background: var(--accent); transform: scale(1.3); }
#spy a span { position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
  white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; padding: 2px 8px;
  border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .15s; }
#spy a:hover span { opacity: 1; }

main { max-width: 820px; margin: 0 auto; padding: 56px 24px 96px; }

/* masthead + hero stats */
.masthead { border-bottom: 2px solid var(--ink); padding-bottom: 22px; margin-bottom: 8px; }
.masthead .kicker { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.masthead h1 { font-size: 38px; line-height: 1.15; margin: 10px 0 8px; font-weight: 700; letter-spacing: -.02em; }
.masthead .deck { font-size: 19px; color: var(--ink-soft); }
.stat-band { display: flex; flex-wrap: wrap; gap: 14px; margin: 26px 0 10px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 18px; flex: 1 1 120px; }
.stat .num { font-family: ui-monospace, monospace; font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
.stat .lbl { font-size: 12px; color: var(--ink-faint); margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; }

/* sections + reveal */
section { padding-top: 40px; }
section.reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
section.reveal.in { opacity: 1; transform: none; }
.ch-num { font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent); letter-spacing: .1em; }
h2 { font-size: 27px; font-weight: 700; margin: 4px 0 14px; letter-spacing: -.01em; }
h3 { font-size: 20px; font-weight: 600; margin: 26px 0 10px; }
p { margin: 0 0 1em; }
.lede { font-size: 1.06rem; color: var(--ink-soft); }

/* concept map strip */
.map { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--surface-2);
  border: 1px solid var(--rule); border-radius: 12px; padding: 16px; margin: 16px 0; }
.map .box { background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.map .arrow { color: var(--ink-faint); font-size: 18px; }

/* callouts */
.callout { border-radius: 10px; padding: 14px 18px; margin: 18px 0; border-left: 4px solid var(--insight); background: var(--surface); }
.callout .ct { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
.callout.insight { border-color: var(--insight); } .callout.insight .ct { color: var(--insight); }
.callout.danger  { border-color: var(--danger);  background:#fff5f5; } .callout.danger .ct { color: var(--danger); }
.callout.success { border-color: var(--success); background:#f4fcf6; } .callout.success .ct { color: var(--success); }
.callout.warning { border-color: var(--warning); background:#fffbf0; } .callout.warning .ct { color: var(--warning); }
.callout.key     { border-color: var(--key);     background:#f8f5ff; } .callout.key .ct { color: var(--key); }
.callout p:last-child { margin: 0; }

/* math block: numbered + plain-language gloss */
.math-block { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px; margin: 16px 0; position: relative; }
.math-block .math-label { position: absolute; right: 14px; top: 10px; font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); }
.math-block .math-note { font-style: italic; color: var(--ink-soft); font-size: .94rem; margin-top: 8px; }

/* labs (interactive) */
.lab { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; margin: 20px 0; }
.lab .lab-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.lab canvas { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 8px; background: var(--surface-2); }
.lab .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 12px; }
.lab .ctrl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 140px; }
.lab .ctrl label { color: var(--ink-faint); }
.lab .ctrl output { font-family: ui-monospace, monospace; color: var(--ink); font-weight: 600; }
.lab input[type=range] { width: 100%; accent-color: var(--accent); }
.lab button { background: var(--accent); color: #fff; border: 0; border-radius: 7px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.lab button.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule-2); }
.lab .readout { font-family: ui-monospace, monospace; font-size: 13px; color: var(--ink-soft); margin-top: 10px; }

/* quiz */
.quiz { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; margin: 20px 0; }
.quiz .q { font-weight: 600; margin-bottom: 10px; }
.quiz .opt { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; padding: 9px 12px; margin: 6px 0; cursor: pointer; font-size: 15px; }
.quiz .opt.correct { border-color: var(--success); background:#f4fcf6; }
.quiz .opt.wrong { border-color: var(--danger); background:#fff5f5; }
.quiz .fb { font-size: .94rem; color: var(--ink-soft); margin-top: 8px; display: none; }

/* code + tables */
pre { background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: .9rem; border: 1px solid var(--rule); }
code { background: var(--code-bg); padding: .05rem .3rem; border-radius: 4px; font-size: .9em; }
pre code { background: transparent; padding: 0; }
table.cmp { width: 100%; border-collapse: collapse; font-size: .95rem; margin: 16px 0; }
table.cmp th, table.cmp td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
table.cmp th { color: var(--accent); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
a { color: var(--accent); }

footer { max-width: 820px; margin: 0 auto; padding: 24px; border-top: 1px solid var(--rule); color: var(--ink-faint); font-size: 13px; }

@media (max-width: 720px) {
  main { padding: 40px 16px 72px; } .masthead h1 { font-size: 30px; }
  #spy { display: none; } .lab .controls { flex-direction: column; align-items: stretch; }
}
@media (max-width: 480px) { body { font-size: 16px; } .masthead h1 { font-size: 25px; } h2 { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } section.reveal { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="progress"></div>
<nav id="spy"><!-- one <a href="#sec-id" class="..."><span>title</span></a> per section, generated --></nav>

<main>
  <header class="masthead">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{TITLE}}</h1>
    <div class="deck">{{DECK}}</div>
    <div class="stat-band">
      {{STATS}}
    </div>
  </header>

  <!-- SECTIONS GO HERE.
       Each: <section id="sec-<slug>" class="reveal">
               <div class="ch-num">01</div><h2>...</h2>
               ...problem-first prose, .math-block, .lab, worked example, .quiz checkpoint...
             </section>
       Spine: cold-open(why) → 先画地图(.map) → body sections → connections → quiz → close(table.cmp).
  -->

</main>

<footer>{{FOOTER}}</footer>

<script>
"use strict";
/* === JS palette: MUST mirror the CSS :root variable colors (color-as-type law) === */
const C = {
  ink:'#16181d', inkSoft:'#3a3f4b', inkFaint:'#6b7280', rule:'#cdd2dc',
  accent:'#3b5bdb', accent2:'#0c8599',
  v1:'#e03131', v2:'#3b5bdb', v3:'#2f9e44', v4:'#7048e8', v5:'#e8a000'
};

/* === DPR-correct canvas setup: call once per lab, draw in CSS pixels === */
function setupCanvas(canvas, cssW, cssH) {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function drawArrow(ctx, x1, y1, x2, y2, color, w) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w || 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), h = 8;
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - h * Math.cos(a - .4), y2 - h * Math.sin(a - .4));
  ctx.lineTo(x2 - h * Math.cos(a + .4), y2 - h * Math.sin(a + .4));
  ctx.closePath(); ctx.fill();
}

/* === reading-UX furniture: progress bar + scroll-spy + reveal === */
(function () {
  const bar = document.getElementById('progress');
  const secs = [...document.querySelectorAll('main section[id]')];
  const spy = document.getElementById('spy');
  secs.forEach(s => {
    const a = document.createElement('a'); a.href = '#' + s.id;
    const t = (s.querySelector('h2') || {}).textContent || s.id;
    a.innerHTML = '<span>' + t + '</span>'; spy.appendChild(a);
  });
  const links = [...spy.children];
  function onScroll() {
    const h = document.documentElement;
    bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
    let cur = 0; secs.forEach((s, i) => { if (s.getBoundingClientRect().top < window.innerHeight * 0.4) cur = i; });
    links.forEach((l, i) => l.classList.toggle('active', i === cur));
  }
  document.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: 0.08 });
  document.querySelectorAll('section.reveal').forEach(s => io.observe(s));
})();

/* === quiz checking === */
function quizPick(btn, correct) {
  const box = btn.closest('.quiz'); if (box.dataset.done) return;
  box.dataset.done = '1';
  box.querySelectorAll('.opt').forEach(o => o.classList.add(o.dataset.correct === '1' ? 'correct' : (o === btn ? 'wrong' : '')));
  const fb = box.querySelector('.fb'); if (fb) { fb.style.display = 'block'; if (window.renderMathInElement) renderMathInElement(fb); }
}

/* === KaTeX render (deferred, on DOMContentLoaded) === */
document.addEventListener('DOMContentLoaded', function () {
  if (window.renderMathInElement) renderMathInElement(document.body, {
    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
    throwOnError: false, ignoredTags: ['pre', 'code', 'script', 'style']
  });
  // quiz integrity: each .quiz must have exactly one data-correct="1" — flags the inverted/blank-flag bug during QA
  document.querySelectorAll('.quiz').forEach(function (q, i) {
    var n = q.querySelectorAll('.opt[data-correct="1"]').length;
    if (n !== 1) { console.warn('[distill-report] quiz #' + i + ' has ' + n + ' correct option(s), expected 1'); q.style.outline = '2px dashed var(--danger)'; }
  });
});

/* === LABS: each lab is an IIFE ending in draw(), with lab-prefixed ids. Example pattern:
(function () {
  const c = document.getElementById('lab1-canvas'); if (!c) return;
  const ctx = setupCanvas(c, 760, 320);
  const s = document.getElementById('lab1-sigma');
  function draw() {
    ctx.clearRect(0, 0, 760, 320);
    const sigma = +s.value;            // read control
    // ... REAL computation here (no lerp-to-prerendered, no hard-coded result) ...
  }
  s.addEventListener('input', draw); draw();   // render on init
})();
=== */
</script>
</body>
</html>
