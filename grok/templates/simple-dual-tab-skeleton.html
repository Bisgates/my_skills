<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!-- shared title (Chinese) — same title for both tabs --></title>

<!--
  ============================================================
  simple-dual-tab skeleton — the new default visual layer for
  grok's dual-tab output. Both tabs render under `simple`:
    - bird tab uses simple-bird's CSS (Roman-numeral chapter
      openers, drop-cap lede, callout / pull / matrix)
    - frog tab uses simple-frog's CSS (cell.md / cell.code /
      cell.out, mono section headings, stop-and-think)

  Hard contract:
    - Zero external assets — no Google Fonts, no KaTeX, no Prism.
    - Both tabs share the warm-paper color tokens declared once
      in :root below.
    - All bird styles live under `.tab-bird ...`; all frog styles
      under `.tab-frog ...`. The two sub-styles share class names
      (`.callout`, `.cell`) and mean different things — un-namespaced
      rules cross-wire.
    - Tab bar is sticky-top, small-caps button text, active state
      = accent-colored underline.
    - Hash routing: #bird-<slug> activates bird tab + scrolls;
      #frog-<slug> activates frog tab + scrolls; legacy #mit- and
      #stanford- prefixes remap silently for backward compatibility.

  Fill order:
    1. Drop simple-bird-skeleton.html's body content into
       <section id="tab-bird"> below. Rewrite all section ids
       `id="x"` → `id="bird-x"`.
    2. Drop simple-frog-skeleton.html's body content into
       <section id="tab-frog">. Section ids `id="x"` → `id="frog-x"`.
       Match slugs `x` across tabs.
    3. Don't add per-section "↔ 另一视角" jump buttons. The tab
       bar at the top is the only cross-tab affordance.

  If the source has heavy LaTeX, either pass --math (and add the
  KaTeX CDN block back at the document level) or rerun with
  --visual magazine.
  ============================================================
-->

<style>
/* ============================================================
   Shared tokens (apply to both tabs)
   ============================================================ */
:root {
  --paper:        #f0eee6;
  --paper-2:      #e8e6dc;
  --ink:          #1f1a14;
  --ink-soft:     #3b332a;
  --ink-faint:    #6b6052;
  --rule:         #b8a583;
  --rule-soft:    #d8c9a2;
  --accent:       #8c2f1c;
  --accent-2:     #2c5340;
  --gold:         #a37c2a;
  --quote-bg:     #f0e6cd;
  --code-bg:      #efe6ce;
  --code-fg:      #1a140d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Iowan Old Style", "Charter", "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-size: 22.5px; line-height: 1.7;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 6em; }
.mono, code, pre {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}

/* ============================================================
   Tab bar — sticky, small-caps, accent underline on active
   ============================================================ */
.tabbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; gap: 0;
  background: var(--paper-2);
  border-bottom: 1.25px solid var(--rule);
  padding: 0 30px;
}
.tab-btn {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-size: 17.5px; color: var(--ink-faint);
  padding: 17.5px 27.5px; cursor: pointer;
  border-bottom: 2.5px solid transparent;
  font-variant: small-caps; letter-spacing: 0.12em;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab-meta {
  margin-left: auto; align-self: center;
  font-size: 15px; color: var(--ink-faint);
  font-style: italic;
}

main { max-width: 1025px; margin: 0 auto; padding: 70px 40px 0; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ============================================================
   bird-tab scope — paste simple-bird-skeleton.html's CSS here,
   each selector under `.tab-bird ...`.
   ============================================================ */

.tab-bird .masthead {
  text-align: center;
  border-top: 5px double var(--rule);
  border-bottom: 1.25px solid var(--rule);
  padding: 40px 0 27.5px;
  margin-bottom: 45px;
}
.tab-bird .masthead .kicker {
  font-variant: small-caps; letter-spacing: 0.28em;
  font-size: 15px; color: var(--accent);
}
.tab-bird .masthead h1 {
  font-size: 55px; line-height: 1.18; margin: 17.5px 0 10px;
  font-weight: 500;
}
.tab-bird .masthead .deck {
  font-style: italic; color: var(--ink-soft);
  font-size: 22.5px; max-width: 775px; margin: 0 auto;
}
.tab-bird .masthead .byline {
  margin-top: 17.5px;
  font-size: 15px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-faint);
}

.tab-bird .chapter-rule {
  text-align: center;
  margin: 80px 0 32.5px;
  color: var(--accent);
  font-variant: small-caps; letter-spacing: 0.3em;
}
.tab-bird .chapter-rule .roman {
  display: inline-block; font-size: 27.5px; font-style: italic;
  padding: 0 22.5px;
  border-top: 1.25px solid var(--rule);
  border-bottom: 1.25px solid var(--rule);
  line-height: 2;
}
.tab-bird .chapter-title {
  text-align: center; font-size: 32.5px;
  font-style: italic; font-weight: 500;
  margin: 0 0 35px; color: var(--ink);
}

.tab-bird p { margin: 0 0 1.05em; }
.tab-bird .lede::first-letter {
  font-size: 4.4em; line-height: 0.86;
  float: left; padding: 7.5px 15px 0 0;
  color: var(--accent);
  font-family: "Iowan Old Style", "Cormorant Garamond", "Playfair Display", Georgia, serif;
  font-weight: 500;
}
.tab-bird h3 {
  font-size: 23.75px; font-weight: 500;
  font-variant: small-caps; letter-spacing: 0.08em;
  margin: 40px 0 15px;
  color: var(--ink-soft);
  border-bottom: 1.25px solid var(--rule-soft);
  padding-bottom: 5px;
}

.tab-bird .callout {
  border-left: 3.75px solid var(--accent);
  background: rgba(140,47,28,0.05);
  padding: 17.5px 22.5px; margin: 27.5px 0;
  font-size: 20.625px;
}
.tab-bird .callout .ctitle {
  font-variant: small-caps; letter-spacing: 0.12em;
  font-size: 15px; color: var(--accent); margin-bottom: 5px;
}
.tab-bird .pull {
  margin: 35px 0; text-align: center;
  font-style: italic; font-size: 27.5px;
  color: var(--accent-2); line-height: 1.4;
  border-top: 1.25px solid var(--rule-soft);
  border-bottom: 1.25px solid var(--rule-soft);
  padding: 17.5px 0;
}
.tab-bird .pull .who {
  display: block; margin-top: 10px;
  font-size: 15px; letter-spacing: 0.12em;
  font-style: normal; color: var(--ink-faint);
  text-transform: uppercase;
}
.tab-bird .matrix {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 20px; margin: 27.5px 0;
}
.tab-bird .matrix .cell {
  border: 1.25px solid var(--rule);
  background: var(--paper-2);
  padding: 17.5px 20px; font-size: 19.375px;
}
.tab-bird .matrix .cell .h {
  font-variant: small-caps; letter-spacing: 0.1em;
  font-size: 15px; color: var(--accent); margin-bottom: 7.5px;
}

.tab-bird code {
  background: var(--code-bg); color: var(--code-fg);
  padding: 1.25px 6.25px; border-radius: 2.5px;
  font-size: 0.88em;
}
.tab-bird pre {
  background: var(--code-bg);
  border-left: 3.75px solid var(--gold);
  padding: 17.5px 22.5px; overflow-x: auto;
  font-size: 16.875px; line-height: 1.55;
  margin: 27.5px 0;
}
.tab-bird pre code { background: transparent; padding: 0; }

.tab-bird table {
  width: 100%; border-collapse: collapse;
  margin: 27.5px 0; font-size: 19.375px;
}
.tab-bird th, .tab-bird td {
  border-top: 1.25px solid var(--rule-soft);
  border-bottom: 1.25px solid var(--rule-soft);
  padding: 10px 12.5px; text-align: left;
  vertical-align: top;
}
.tab-bird th {
  font-variant: small-caps; letter-spacing: 0.08em;
  color: var(--accent);
  border-bottom: 1.25px solid var(--rule);
}

.tab-bird .afterword {
  margin: 70px 0 35px;
  border: 1.25px solid var(--ink-soft);
  background: var(--paper-2);
  padding: 27.5px 30px;
}
.tab-bird .afterword .label {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-faint);
}
.tab-bird .afterword h4 {
  font-style: italic; font-weight: 500;
  font-size: 27.5px; margin: 7.5px 0 15px;
  color: var(--ink);
}

/* ============================================================
   frog-tab scope — paste simple-frog-skeleton.html's CSS here,
   each selector under `.tab-frog ...`.
   ============================================================ */

.tab-frog {
  font-family: -apple-system, "Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
}
.tab-frog .nb-head {
  border-bottom: 2.5px solid var(--ink-soft);
  padding: 0 0 22.5px; margin-bottom: 32.5px;
}
.tab-frog .nb-head .stamp {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 15px; color: var(--ink-faint);
  letter-spacing: 0.05em;
}
.tab-frog .nb-head h1 {
  margin: 7.5px 0 5px; font-size: 37.5px; font-weight: 500;
}
.tab-frog .nb-head .sub {
  font-style: italic; color: var(--ink-soft); font-size: 20px;
}

.tab-frog h2.section {
  font-size: 22.5px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-variant: small-caps; letter-spacing: 0.14em;
  color: var(--accent-2);
  margin: 52.5px 0 12.5px;
  padding: 0 0 5px;
  border-bottom: 1.25px solid var(--rule);
  display: flex; align-items: baseline; gap: 15px;
}
.tab-frog h2.section .num {
  color: var(--ink-faint); font-size: 15px;
}
.tab-frog h3.subsection {
  font-size: 20px; font-weight: 500;
  color: var(--ink-soft);
  margin: 27.5px 0 7.5px;
}

.tab-frog .cell {
  margin: 17.5px 0;
  border-left: 5px solid transparent;
  padding-left: 17.5px;
}
.tab-frog .cell.md   { border-color: var(--rule); }
.tab-frog .cell.code { border-color: var(--accent-2); }
.tab-frog .cell.out  { border-color: var(--gold); }
.tab-frog .cell .label {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; color: var(--ink-faint);
  margin-bottom: 5px;
  letter-spacing: 0.04em;
}
.tab-frog .cell.code pre {
  background: var(--code-bg);
  padding: 15px 17.5px;
  font-size: 16.25px; line-height: 1.55;
  overflow-x: auto; margin: 0;
}
.tab-frog .cell.out pre {
  background: transparent;
  padding: 7.5px 0 0;
  font-size: 16.25px; line-height: 1.55;
  margin: 0; color: var(--ink-soft);
  white-space: pre-wrap;
}
.tab-frog .cell.md p { margin: 0 0 10px; }

.tab-frog code {
  background: var(--code-bg);
  padding: 1.25px 6.25px; border-radius: 2.5px;
  font-size: 0.86em;
}

.tab-frog .stop {
  background: rgba(44,83,64,0.06);
  border-left: 5px solid var(--accent-2);
  padding: 15px 20px; margin: 22.5px 0;
  font-size: 19.375px;
}
.tab-frog .stop .h {
  font-variant: small-caps; letter-spacing: 0.12em;
  font-size: 15px; color: var(--accent-2); margin-bottom: 5px;
}

.tab-frog .callout {
  border-left: 3.75px solid var(--ink-faint);
  background: var(--paper-2);
  padding: 15px 20px; margin: 22.5px 0;
  font-size: 19.375px;
}
.tab-frog .callout .tag {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 5px;
}
.tab-frog .callout.warn  { border-color: var(--gold); }
.tab-frog .callout.warn  .tag { color: var(--gold); }
.tab-frog .callout.red   { border-color: var(--accent); background: rgba(140,47,28,0.05); }
.tab-frog .callout.red   .tag { color: var(--accent); }
.tab-frog .callout.green { border-color: var(--accent-2); background: rgba(44,83,64,0.05); }
.tab-frog .callout.green .tag { color: var(--accent-2); }

.tab-frog .nums {
  display: grid; gap: 15px;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  margin: 22.5px 0;
}
.tab-frog .nums .num-box {
  border: 1.25px solid var(--rule);
  background: var(--paper-2);
  padding: 12.5px 17.5px;
}
.tab-frog .nums .k {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-faint);
}
.tab-frog .nums .v {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 27.5px; font-weight: 500; color: var(--ink);
}

.tab-frog .nb-foot {
  margin-top: 70px; padding-top: 17.5px;
  border-top: 1.25px solid var(--rule);
  font-size: 16.25px; color: var(--ink-faint); font-style: italic;
}

/* ============================================================
   Shared: uncertainty marker
   ============================================================ */
.uncertain {
  border-left: 3.75px dashed var(--accent);
  background: rgba(140,47,28,0.04);
  padding: 12.5px 17.5px; margin: 22.5px 0;
  font-style: italic; color: var(--ink-soft);
}

/* responsive */
@media (max-width: 640px) {
  .tab-bird .masthead h1 { font-size: 40px; }
  .tab-bird .matrix { grid-template-columns: 1fr; }
  main { padding: 40px 22.5px 0; }
}

/* ============================================================
   Narrow-screen (iPhone / mobile) — additive only.
   Tab bar must NOT wrap character-by-character ("鸟/瞰" split is the
   bug we're fixing); code cells get horizontal scroll instead of
   bleeding past the viewport; section padding tightens.
   ============================================================ */
@media (max-width: 720px) {
  /* Tab bar — keep on one line, allow horizontal scroll if needed,
     hide non-essential meta. */
  .tabbar {
    padding: 0 15px;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 15px 17.5px;
    font-size: 16.25px;
    letter-spacing: 0.08em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-meta { display: none; }

  /* Shell */
  main { padding: 35px 17.5px 0; max-width: 100%; }
  body { font-size: 20px; line-height: 1.6; }

  /* Bird tab — text scales, drop cap shrinks, matrix stacks */
  .tab-bird .masthead { padding: 27.5px 0 20px; margin-bottom: 30px; }
  .tab-bird .masthead h1 { font-size: 35px; line-height: 1.22; }
  .tab-bird .masthead .deck { font-size: 20px; }
  .tab-bird .chapter-rule { margin: 55px 0 22.5px; }
  .tab-bird .chapter-rule .roman { font-size: 22.5px; }
  .tab-bird .chapter-title { font-size: 27.5px; margin-bottom: 25px; }
  .tab-bird .lede::first-letter { font-size: 3.2em; padding: 5px 10px 0 0; }
  .tab-bird h3 { font-size: 21.25px; }
  .tab-bird .callout { padding: 15px 17.5px; margin: 22.5px 0; font-size: 19.375px; }
  .tab-bird .pull { font-size: 22.5px; padding: 15px 0; margin: 27.5px 0; }
  .tab-bird .matrix { grid-template-columns: 1fr; gap: 15px; }
  .tab-bird .matrix .cell { padding: 15px 17.5px; font-size: 18.75px; }
  .tab-bird pre {
    padding: 12.5px 15px;
    font-size: 15.625px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-bird pre code { white-space: pre; }
  .tab-bird table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    font-size: 17.5px;
  }
  .tab-bird th, .tab-bird td { padding: 7.5px 10px; }
  .tab-bird .afterword { padding: 22.5px 22.5px; margin: 45px 0 27.5px; }
  .tab-bird .afterword h4 { font-size: 22.5px; }

  /* Frog tab — notebook cell rhythm preserved, padding tightens */
  .tab-frog .nb-head h1 { font-size: 30px; }
  .tab-frog h2.section { font-size: 20px; margin: 40px 0 10px; }
  .tab-frog h3.subsection { font-size: 18.75px; }
  .tab-frog .cell { padding-left: 12.5px; margin: 15px 0; }
  .tab-frog .cell.code pre,
  .tab-frog .cell.out pre {
    padding: 12.5px 15px;
    font-size: 15px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-frog .cell.code pre { white-space: pre; }
  .tab-frog .stop { padding: 12.5px 17.5px; font-size: 18.125px; margin: 17.5px 0; }
  .tab-frog .callout { padding: 12.5px 17.5px; font-size: 18.125px; margin: 17.5px 0; }
  .tab-frog .nums { gap: 12.5px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tab-frog .nums .num-box { padding: 10px 15px; }
  .tab-frog .nums .v { font-size: 22.5px; }
}

@media (max-width: 480px) {
  .tabbar { padding: 0 10px; }
  .tab-btn { padding: 12.5px 13.75px; font-size: 15px; letter-spacing: 0.06em; }
  main { padding: 27.5px 15px 0; }
  body { font-size: 18.75px; }

  .tab-bird .masthead h1 { font-size: 30px; }
  .tab-bird .chapter-title { font-size: 23.75px; }
  .tab-bird .lede::first-letter { font-size: 2.8em; }
  .tab-bird pre { padding: 10px 12.5px; font-size: 14.375px; }
  .tab-bird .pull { font-size: 21.25px; }

  .tab-frog .nb-head h1 { font-size: 26.25px; }
  .tab-frog .cell.code pre,
  .tab-frog .cell.out pre { padding: 10px 12.5px; font-size: 14.375px; }
}
</style>
</head>
<body>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="bird">Bird &middot; 鸟瞰</button>
  <button class="tab-btn" data-tab="frog">Frog &middot; 蛙跳</button>
  <span class="tab-meta"><!-- optional: source name · version · ISO date --></span>
</nav>

<main>

<!-- ============ BIRD TAB ============ -->
<!-- Paste simple-bird-skeleton.html's <body><main>…</main></body> contents
     here. Rewrite all `id="x"` → `id="bird-x"`. Match slugs `x` across tabs
     so #frog-<slug> ↔ #bird-<slug> deep-links resolve to corresponding
     sections under the global tab bar (do NOT add per-section jump buttons). -->
<section class="tab-pane tab-bird active" id="tab-bird">
  <!-- BIRD BODY HERE -->
</section>

<!-- ============ FROG TAB ============ -->
<!-- Paste simple-frog-skeleton.html's <body><main>…</main></body> contents
     here. Rewrite all `id="x"` → `id="frog-x"`. Match slugs `x` across tabs. -->
<section class="tab-pane tab-frog" id="tab-frog">
  <!-- FROG BODY HERE -->
</section>

</main>

<script>
(function () {
  var buttons = document.querySelectorAll('.tab-btn');
  var panes   = document.querySelectorAll('.tab-pane');
  function activate(name) {
    buttons.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === name);
    });
    panes.forEach(function (p) {
      p.classList.toggle('active', p.id === 'tab-' + name);
    });
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      activate(b.getAttribute('data-tab'));
      history.replaceState(null, '', '#' + b.getAttribute('data-tab'));
    });
  });
  // Deep link: #bird-<slug> / #frog-<slug> switches tab + scrolls.
  // Legacy aliases #mit-<slug> / #stanford-<slug> remap silently.
  function routeHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    if (h.indexOf('mit-') === 0)      h = 'bird-' + h.slice(4);
    if (h.indexOf('stanford-') === 0) h = 'frog-' + h.slice(9);
    if (h.indexOf('bird-') === 0) activate('bird');
    else if (h.indexOf('frog-') === 0) activate('frog');
    else if (h === 'bird' || h === 'frog') { activate(h); return; }
    setTimeout(function () {
      var el = document.getElementById(h);
      if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
    }, 0);
  }
  window.addEventListener('hashchange', routeHash);
  routeHash();
})();
</script>

</body>
</html>
