<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!-- shared title (Chinese) — same title for both tabs --></title>

<!--
  ============================================================
  simple-dual-tab skeleton — the new default visual layer for
  grok's dual-tab output. Both tabs render under `simple`:
    - bird tab uses simple-bird's CSS (Roman-numeral chapter
      openers, drop-cap lede, callout / pull / matrix)
    - frog tab uses simple-frog's CSS (cell.md / cell.code /
      cell.out, mono section headings, stop-and-think)

  Hard contract:
    - Zero external assets — no Google Fonts, no KaTeX, no Prism.
    - Both tabs share the warm-paper color tokens declared once
      in :root below.
    - All bird styles live under `.tab-bird ...`; all frog styles
      under `.tab-frog ...`. The two sub-styles share class names
      (`.callout`, `.cell`) and mean different things — un-namespaced
      rules cross-wire.
    - Tab bar is sticky-top, small-caps button text, active state
      = accent-colored underline.
    - Hash routing: #bird-<slug> activates bird tab + scrolls;
      #frog-<slug> activates frog tab + scrolls; legacy #mit- and
      #stanford- prefixes remap silently for backward compatibility.

  Fill order:
    1. Drop simple-bird-skeleton.html's body content into
       <section id="tab-bird"> below. Rewrite all section ids
       `id="x"` → `id="bird-x"`.
    2. Drop simple-frog-skeleton.html's body content into
       <section id="tab-frog">. Section ids `id="x"` → `id="frog-x"`.
       Match slugs `x` across tabs.
    3. Don't add per-section "↔ 另一视角" jump buttons. The tab
       bar at the top is the only cross-tab affordance.

  If the source has heavy LaTeX, either pass --math (and add the
  KaTeX CDN block back at the document level) or rerun with
  --visual magazine.
  ============================================================
-->

<style>
/* ============================================================
   Shared tokens (apply to both tabs)
   ============================================================ */
:root {
  --paper:        #fbf6e9;
  --paper-2:      #f3ebd6;
  --ink:          #1f1a14;
  --ink-soft:     #3b332a;
  --ink-faint:    #6b6052;
  --rule:         #b8a583;
  --rule-soft:    #d8c9a2;
  --accent:       #8c2f1c;
  --accent-2:     #2c5340;
  --gold:         #a37c2a;
  --quote-bg:     #f0e6cd;
  --code-bg:      #efe6ce;
  --code-fg:      #1a140d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Iowan Old Style", "Charter", "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-size: 18px; line-height: 1.7;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 6em; }
.mono, code, pre {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}

/* ============================================================
   Tab bar — sticky, small-caps, accent underline on active
   ============================================================ */
.tabbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; gap: 0;
  background: var(--paper-2);
  border-bottom: 1px solid var(--rule);
  padding: 0 24px;
}
.tab-btn {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-size: 14px; color: var(--ink-faint);
  padding: 14px 22px; cursor: pointer;
  border-bottom: 2px solid transparent;
  font-variant: small-caps; letter-spacing: 0.12em;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab-meta {
  margin-left: auto; align-self: center;
  font-size: 12px; color: var(--ink-faint);
  font-style: italic;
}

main { max-width: 820px; margin: 0 auto; padding: 56px 32px 0; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ============================================================
   bird-tab scope — paste simple-bird-skeleton.html's CSS here,
   each selector under `.tab-bird ...`.
   ============================================================ */

.tab-bird .masthead {
  text-align: center;
  border-top: 4px double var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 32px 0 22px;
  margin-bottom: 36px;
}
.tab-bird .masthead .kicker {
  font-variant: small-caps; letter-spacing: 0.28em;
  font-size: 12px; color: var(--accent);
}
.tab-bird .masthead h1 {
  font-size: 44px; line-height: 1.18; margin: 14px 0 8px;
  font-weight: 500;
}
.tab-bird .masthead .deck {
  font-style: italic; color: var(--ink-soft);
  font-size: 18px; max-width: 620px; margin: 0 auto;
}
.tab-bird .masthead .byline {
  margin-top: 14px;
  font-size: 12px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-faint);
}

.tab-bird .chapter-rule {
  text-align: center;
  margin: 64px 0 26px;
  color: var(--accent);
  font-variant: small-caps; letter-spacing: 0.3em;
}
.tab-bird .chapter-rule .roman {
  display: inline-block; font-size: 22px; font-style: italic;
  padding: 0 18px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  line-height: 2;
}
.tab-bird .chapter-title {
  text-align: center; font-size: 26px;
  font-style: italic; font-weight: 500;
  margin: 0 0 28px; color: var(--ink);
}

.tab-bird p { margin: 0 0 1.05em; }
.tab-bird .lede::first-letter {
  font-size: 4.4em; line-height: 0.86;
  float: left; padding: 6px 12px 0 0;
  color: var(--accent);
  font-family: "Iowan Old Style", "Cormorant Garamond", "Playfair Display", Georgia, serif;
  font-weight: 500;
}
.tab-bird h3 {
  font-size: 19px; font-weight: 500;
  font-variant: small-caps; letter-spacing: 0.08em;
  margin: 32px 0 12px;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--rule-soft);
  padding-bottom: 4px;
}

.tab-bird .callout {
  border-left: 3px solid var(--accent);
  background: rgba(140,47,28,0.05);
  padding: 14px 18px; margin: 22px 0;
  font-size: 16.5px;
}
.tab-bird .callout .ctitle {
  font-variant: small-caps; letter-spacing: 0.12em;
  font-size: 12px; color: var(--accent); margin-bottom: 4px;
}
.tab-bird .pull {
  margin: 28px 0; text-align: center;
  font-style: italic; font-size: 22px;
  color: var(--accent-2); line-height: 1.4;
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  padding: 14px 0;
}
.tab-bird .pull .who {
  display: block; margin-top: 8px;
  font-size: 12px; letter-spacing: 0.12em;
  font-style: normal; color: var(--ink-faint);
  text-transform: uppercase;
}
.tab-bird .matrix {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; margin: 22px 0;
}
.tab-bird .matrix .cell {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 14px 16px; font-size: 15.5px;
}
.tab-bird .matrix .cell .h {
  font-variant: small-caps; letter-spacing: 0.1em;
  font-size: 12px; color: var(--accent); margin-bottom: 6px;
}

.tab-bird code {
  background: var(--code-bg); color: var(--code-fg);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.88em;
}
.tab-bird pre {
  background: var(--code-bg);
  border-left: 3px solid var(--gold);
  padding: 14px 18px; overflow-x: auto;
  font-size: 13.5px; line-height: 1.55;
  margin: 22px 0;
}
.tab-bird pre code { background: transparent; padding: 0; }

.tab-bird table {
  width: 100%; border-collapse: collapse;
  margin: 22px 0; font-size: 15.5px;
}
.tab-bird th, .tab-bird td {
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  padding: 8px 10px; text-align: left;
  vertical-align: top;
}
.tab-bird th {
  font-variant: small-caps; letter-spacing: 0.08em;
  color: var(--accent);
  border-bottom: 1px solid var(--rule);
}

.tab-bird .afterword {
  margin: 56px 0 28px;
  border: 1px solid var(--ink-soft);
  background: var(--paper-2);
  padding: 22px 24px;
}
.tab-bird .afterword .label {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-faint);
}
.tab-bird .afterword h4 {
  font-style: italic; font-weight: 500;
  font-size: 22px; margin: 6px 0 12px;
  color: var(--ink);
}

/* ============================================================
   frog-tab scope — paste simple-frog-skeleton.html's CSS here,
   each selector under `.tab-frog ...`.
   ============================================================ */

.tab-frog {
  font-family: -apple-system, "Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
}
.tab-frog .nb-head {
  border-bottom: 2px solid var(--ink-soft);
  padding: 0 0 18px; margin-bottom: 26px;
}
.tab-frog .nb-head .stamp {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px; color: var(--ink-faint);
  letter-spacing: 0.05em;
}
.tab-frog .nb-head h1 {
  margin: 6px 0 4px; font-size: 30px; font-weight: 500;
}
.tab-frog .nb-head .sub {
  font-style: italic; color: var(--ink-soft); font-size: 16px;
}

.tab-frog h2.section {
  font-size: 18px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-variant: small-caps; letter-spacing: 0.14em;
  color: var(--accent-2);
  margin: 42px 0 10px;
  padding: 0 0 4px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: baseline; gap: 12px;
}
.tab-frog h2.section .num {
  color: var(--ink-faint); font-size: 12px;
}
.tab-frog h3.subsection {
  font-size: 16px; font-weight: 500;
  color: var(--ink-soft);
  margin: 22px 0 6px;
}

.tab-frog .cell {
  margin: 14px 0;
  border-left: 4px solid transparent;
  padding-left: 14px;
}
.tab-frog .cell.md   { border-color: var(--rule); }
.tab-frog .cell.code { border-color: var(--accent-2); }
.tab-frog .cell.out  { border-color: var(--gold); }
.tab-frog .cell .label {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; color: var(--ink-faint);
  margin-bottom: 4px;
  letter-spacing: 0.04em;
}
.tab-frog .cell.code pre {
  background: var(--code-bg);
  padding: 12px 14px;
  font-size: 13px; line-height: 1.55;
  overflow-x: auto; margin: 0;
}
.tab-frog .cell.out pre {
  background: transparent;
  padding: 6px 0 0;
  font-size: 13px; line-height: 1.55;
  margin: 0; color: var(--ink-soft);
  white-space: pre-wrap;
}
.tab-frog .cell.md p { margin: 0 0 8px; }

.tab-frog code {
  background: var(--code-bg);
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.86em;
}

.tab-frog .stop {
  background: rgba(44,83,64,0.06);
  border-left: 4px solid var(--accent-2);
  padding: 12px 16px; margin: 18px 0;
  font-size: 15.5px;
}
.tab-frog .stop .h {
  font-variant: small-caps; letter-spacing: 0.12em;
  font-size: 12px; color: var(--accent-2); margin-bottom: 4px;
}

.tab-frog .callout {
  border-left: 3px solid var(--ink-faint);
  background: var(--paper-2);
  padding: 12px 16px; margin: 18px 0;
  font-size: 15.5px;
}
.tab-frog .callout .tag {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 4px;
}
.tab-frog .callout.warn  { border-color: var(--gold); }
.tab-frog .callout.warn  .tag { color: var(--gold); }
.tab-frog .callout.red   { border-color: var(--accent); background: rgba(140,47,28,0.05); }
.tab-frog .callout.red   .tag { color: var(--accent); }
.tab-frog .callout.green { border-color: var(--accent-2); background: rgba(44,83,64,0.05); }
.tab-frog .callout.green .tag { color: var(--accent-2); }

.tab-frog .nums {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  margin: 18px 0;
}
.tab-frog .nums .num-box {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 10px 14px;
}
.tab-frog .nums .k {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-faint);
}
.tab-frog .nums .v {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 22px; font-weight: 500; color: var(--ink);
}

.tab-frog .nb-foot {
  margin-top: 56px; padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-size: 13px; color: var(--ink-faint); font-style: italic;
}

/* ============================================================
   Shared: uncertainty marker
   ============================================================ */
.uncertain {
  border-left: 3px dashed var(--accent);
  background: rgba(140,47,28,0.04);
  padding: 10px 14px; margin: 18px 0;
  font-style: italic; color: var(--ink-soft);
}

/* responsive */
@media (max-width: 640px) {
  .tab-bird .masthead h1 { font-size: 32px; }
  .tab-bird .matrix { grid-template-columns: 1fr; }
  main { padding: 32px 18px 0; }
}

/* ============================================================
   Narrow-screen (iPhone / mobile) — additive only.
   Tab bar must NOT wrap character-by-character ("鸟/瞰" split is the
   bug we're fixing); code cells get horizontal scroll instead of
   bleeding past the viewport; section padding tightens.
   ============================================================ */
@media (max-width: 720px) {
  /* Tab bar — keep on one line, allow horizontal scroll if needed,
     hide non-essential meta. */
  .tabbar {
    padding: 0 12px;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 12px 14px;
    font-size: 13px;
    letter-spacing: 0.08em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-meta { display: none; }

  /* Shell */
  main { padding: 28px 14px 0; max-width: 100%; }
  body { font-size: 16px; line-height: 1.6; }

  /* Bird tab — text scales, drop cap shrinks, matrix stacks */
  .tab-bird .masthead { padding: 22px 0 16px; margin-bottom: 24px; }
  .tab-bird .masthead h1 { font-size: 28px; line-height: 1.22; }
  .tab-bird .masthead .deck { font-size: 16px; }
  .tab-bird .chapter-rule { margin: 44px 0 18px; }
  .tab-bird .chapter-rule .roman { font-size: 18px; }
  .tab-bird .chapter-title { font-size: 22px; margin-bottom: 20px; }
  .tab-bird .lede::first-letter { font-size: 3.2em; padding: 4px 8px 0 0; }
  .tab-bird h3 { font-size: 17px; }
  .tab-bird .callout { padding: 12px 14px; margin: 18px 0; font-size: 15.5px; }
  .tab-bird .pull { font-size: 18px; padding: 12px 0; margin: 22px 0; }
  .tab-bird .matrix { grid-template-columns: 1fr; gap: 12px; }
  .tab-bird .matrix .cell { padding: 12px 14px; font-size: 15px; }
  .tab-bird pre {
    padding: 10px 12px;
    font-size: 12.5px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-bird pre code { white-space: pre; }
  .tab-bird table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    font-size: 14px;
  }
  .tab-bird th, .tab-bird td { padding: 6px 8px; }
  .tab-bird .afterword { padding: 18px 18px; margin: 36px 0 22px; }
  .tab-bird .afterword h4 { font-size: 18px; }

  /* Frog tab — notebook cell rhythm preserved, padding tightens */
  .tab-frog .nb-head h1 { font-size: 24px; }
  .tab-frog h2.section { font-size: 16px; margin: 32px 0 8px; }
  .tab-frog h3.subsection { font-size: 15px; }
  .tab-frog .cell { padding-left: 10px; margin: 12px 0; }
  .tab-frog .cell.code pre,
  .tab-frog .cell.out pre {
    padding: 10px 12px;
    font-size: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-frog .cell.code pre { white-space: pre; }
  .tab-frog .stop { padding: 10px 14px; font-size: 14.5px; margin: 14px 0; }
  .tab-frog .callout { padding: 10px 14px; font-size: 14.5px; margin: 14px 0; }
  .tab-frog .nums { gap: 10px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .tab-frog .nums .num-box { padding: 8px 12px; }
  .tab-frog .nums .v { font-size: 18px; }
}

@media (max-width: 480px) {
  .tabbar { padding: 0 8px; }
  .tab-btn { padding: 10px 11px; font-size: 12px; letter-spacing: 0.06em; }
  main { padding: 22px 12px 0; }
  body { font-size: 15px; }

  .tab-bird .masthead h1 { font-size: 24px; }
  .tab-bird .chapter-title { font-size: 19px; }
  .tab-bird .lede::first-letter { font-size: 2.8em; }
  .tab-bird pre { padding: 8px 10px; font-size: 11.5px; }
  .tab-bird .pull { font-size: 17px; }

  .tab-frog .nb-head h1 { font-size: 21px; }
  .tab-frog .cell.code pre,
  .tab-frog .cell.out pre { padding: 8px 10px; font-size: 11.5px; }
}
</style>
</head>
<body>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="bird">Bird &middot; 鸟瞰</button>
  <button class="tab-btn" data-tab="frog">Frog &middot; 蛙跳</button>
  <span class="tab-meta"><!-- optional: source name · version · ISO date --></span>
</nav>

<main>

<!-- ============ BIRD TAB ============ -->
<!-- Paste simple-bird-skeleton.html's <body><main>…</main></body> contents
     here. Rewrite all `id="x"` → `id="bird-x"`. Match slugs `x` across tabs
     so #frog-<slug> ↔ #bird-<slug> deep-links resolve to corresponding
     sections under the global tab bar (do NOT add per-section jump buttons). -->
<section class="tab-pane tab-bird active" id="tab-bird">
  <!-- BIRD BODY HERE -->
</section>

<!-- ============ FROG TAB ============ -->
<!-- Paste simple-frog-skeleton.html's <body><main>…</main></body> contents
     here. Rewrite all `id="x"` → `id="frog-x"`. Match slugs `x` across tabs. -->
<section class="tab-pane tab-frog" id="tab-frog">
  <!-- FROG BODY HERE -->
</section>

</main>

<script>
(function () {
  var buttons = document.querySelectorAll('.tab-btn');
  var panes   = document.querySelectorAll('.tab-pane');
  function activate(name) {
    buttons.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === name);
    });
    panes.forEach(function (p) {
      p.classList.toggle('active', p.id === 'tab-' + name);
    });
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      activate(b.getAttribute('data-tab'));
      history.replaceState(null, '', '#' + b.getAttribute('data-tab'));
    });
  });
  // Deep link: #bird-<slug> / #frog-<slug> switches tab + scrolls.
  // Legacy aliases #mit-<slug> / #stanford-<slug> remap silently.
  function routeHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    if (h.indexOf('mit-') === 0)      h = 'bird-' + h.slice(4);
    if (h.indexOf('stanford-') === 0) h = 'frog-' + h.slice(9);
    if (h.indexOf('bird-') === 0) activate('bird');
    else if (h.indexOf('frog-') === 0) activate('frog');
    else if (h === 'bird' || h === 'frog') { activate(h); return; }
    setTimeout(function () {
      var el = document.getElementById(h);
      if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
    }, 0);
  }
  window.addEventListener('hashchange', routeHash);
  routeHash();
})();
</script>

</body>
</html>
