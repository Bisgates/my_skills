<!--
  ============================================================
  simple-bird-skeleton — the new default visual layer for bird.

  Visual contract: macOS system font stack + warm-paper palette +
  bird-pedagogy magazine markers (Roman-numeral chapter openers,
  drop-cap lede, small-caps section heads, callout / pull / matrix).
  ZERO external assets — no Google Fonts, no KaTeX, no Prism.

  Read references/visual/simple.md + references/pedagogy/bird.md
  before filling this in. visual/simple.md owns the look (palette,
  fonts, required components); pedagogy/bird.md owns the voice
  (meta-question first, asymptotic levers, cross-domain transfer,
  meta-reflection close).

  KaTeX is intentionally absent. If the source has heavy LaTeX,
  either pass --math (the renderer adds the KaTeX CDN block back)
  or rerun with --visual magazine.
  ============================================================
-->

<style>
:root {
  --paper:        #f0eee6;
  --paper-2:      #e8e6dc;
  --ink:          #1f1a14;
  --ink-soft:     #3b332a;
  --ink-faint:    #6b6052;
  --rule:         #b8a583;
  --rule-soft:    #d8c9a2;
  --accent:       #8c2f1c;
  --accent-2:     #2c5340;
  --gold:         #a37c2a;
  --quote-bg:     #f0e6cd;
  --code-bg:      #efe6ce;
  --code-fg:      #1a140d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Iowan Old Style", "Charter", "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-size: 22.5px; line-height: 1.7;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 6em; }
.mono, code, pre {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}

main { max-width: 1025px; margin: 0 auto; padding: 70px 40px 0; }

/* ============================================================
   Masthead (hero)
   ============================================================ */
.masthead {
  text-align: center;
  border-top: 5px double var(--rule);
  border-bottom: 1.25px solid var(--rule);
  padding: 40px 0 27.5px;
  margin-bottom: 45px;
}
.masthead .kicker {
  font-variant: small-caps;
  letter-spacing: 0.28em;
  font-size: 15px;
  color: var(--accent);
}
.masthead h1 {
  font-size: 55px; line-height: 1.18; margin: 17.5px 0 10px;
  font-weight: 500;
}
.masthead .deck {
  font-style: italic; color: var(--ink-soft);
  font-size: 22.5px; max-width: 775px; margin: 0 auto;
}
.masthead .byline {
  margin-top: 17.5px;
  font-size: 15px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-faint);
}

/* ============================================================
   Chapter openers (Roman numerals, bird-pedagogy marker)
   ============================================================ */
.chapter-rule {
  text-align: center;
  margin: 80px 0 32.5px;
  color: var(--accent);
  font-variant: small-caps;
  letter-spacing: 0.3em;
}
.chapter-rule .roman {
  display: inline-block;
  font-size: 27.5px;
  font-style: italic;
  padding: 0 22.5px;
  border-top: 1.25px solid var(--rule);
  border-bottom: 1.25px solid var(--rule);
  line-height: 2;
}
.chapter-title {
  text-align: center;
  font-size: 32.5px;
  font-style: italic;
  font-weight: 500;
  margin: 0 0 35px;
  color: var(--ink);
}

/* ============================================================
   Body prose + drop-cap lede
   ============================================================ */
p { margin: 0 0 1.05em; }
.lede::first-letter {
  font-size: 4.4em; line-height: 0.86;
  float: left; padding: 7.5px 15px 0 0;
  color: var(--accent);
  font-family: "Iowan Old Style", "Cormorant Garamond", "Playfair Display", Georgia, serif;
  font-weight: 500;
}
h3 {
  font-size: 23.75px; font-weight: 500;
  font-variant: small-caps; letter-spacing: 0.08em;
  margin: 40px 0 15px;
  color: var(--ink-soft);
  border-bottom: 1.25px solid var(--rule-soft);
  padding-bottom: 5px;
}

/* ============================================================
   Callouts / pull-quote / matrix
   ============================================================ */
.callout {
  border-left: 3.75px solid var(--accent);
  background: rgba(140,47,28,0.05);
  padding: 17.5px 22.5px;
  margin: 27.5px 0;
  font-size: 20.625px;
}
.callout .ctitle {
  font-variant: small-caps; letter-spacing: 0.12em;
  font-size: 15px; color: var(--accent); margin-bottom: 5px;
}
.pull {
  margin: 35px 0;
  text-align: center;
  font-style: italic;
  font-size: 27.5px;
  color: var(--accent-2);
  line-height: 1.4;
  border-top: 1.25px solid var(--rule-soft);
  border-bottom: 1.25px solid var(--rule-soft);
  padding: 17.5px 0;
}
.pull .who {
  display: block; margin-top: 10px;
  font-size: 15px; letter-spacing: 0.12em;
  font-style: normal; color: var(--ink-faint);
  text-transform: uppercase;
}
.matrix {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 27.5px 0;
}
.matrix .cell {
  border: 1.25px solid var(--rule);
  background: var(--paper-2);
  padding: 17.5px 20px;
  font-size: 19.375px;
}
.matrix .cell .h {
  font-variant: small-caps; letter-spacing: 0.1em;
  font-size: 15px; color: var(--accent); margin-bottom: 7.5px;
}

/* ============================================================
   Code blocks (no Prism — plain styled <pre>)
   ============================================================ */
code {
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 1.25px 6.25px; border-radius: 2.5px;
  font-size: 0.88em;
}
pre {
  background: var(--code-bg);
  border-left: 3.75px solid var(--gold);
  padding: 17.5px 22.5px;
  overflow-x: auto;
  font-size: 16.875px; line-height: 1.55;
  margin: 27.5px 0;
}
pre code { background: transparent; padding: 0; }

/* ============================================================
   Tables
   ============================================================ */
table {
  width: 100%; border-collapse: collapse;
  margin: 27.5px 0; font-size: 19.375px;
}
th, td {
  border-top: 1.25px solid var(--rule-soft);
  border-bottom: 1.25px solid var(--rule-soft);
  padding: 10px 12.5px; text-align: left;
  vertical-align: top;
}
th {
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--accent);
  border-bottom: 1.25px solid var(--rule);
}

/* ============================================================
   Optional: afterword kicker box
   ============================================================ */
.afterword {
  margin: 70px 0 35px;
  border: 1.25px solid var(--ink-soft);
  background: var(--paper-2);
  padding: 27.5px 30px;
}
.afterword .label {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.afterword h4 {
  font-style: italic; font-weight: 500;
  font-size: 27.5px; margin: 7.5px 0 15px;
  color: var(--ink);
}

/* ============================================================
   Uncertainty marker (shared across visuals)
   ============================================================ */
.uncertain {
  border-left: 3.75px dashed var(--accent);
  background: rgba(140,47,28,0.04);
  padding: 12.5px 17.5px; margin: 22.5px 0;
  font-style: italic; color: var(--ink-soft);
}

/* responsive */
@media (max-width: 640px) {
  .masthead h1 { font-size: 40px; }
  main { padding: 40px 22.5px 0; }
  .matrix { grid-template-columns: 1fr; }
}

/* ============================================================
   Narrow-screen (iPhone / mobile) — additive only. Tighten section
   padding, shrink drop cap, allow code + tables to scroll instead of
   bleeding past the viewport.
   ============================================================ */
@media (max-width: 720px) {
  main { padding: 35px 17.5px 0; max-width: 100%; }
  body { font-size: 20px; line-height: 1.6; }

  .masthead { padding: 27.5px 0 20px; margin-bottom: 30px; }
  .masthead h1 { font-size: 35px; line-height: 1.22; }
  .masthead .deck { font-size: 20px; }

  .chapter-rule { margin: 55px 0 22.5px; }
  .chapter-rule .roman { font-size: 22.5px; }
  .chapter-title { font-size: 27.5px; margin-bottom: 25px; }

  h3 { font-size: 21.25px; }
  .lede::first-letter { font-size: 3.2em; padding: 5px 10px 0 0; }

  .callout { padding: 15px 17.5px; margin: 22.5px 0; font-size: 19.375px; }
  .pull { font-size: 22.5px; padding: 15px 0; margin: 27.5px 0; }
  .matrix { grid-template-columns: 1fr; gap: 15px; }
  .matrix .cell { padding: 15px 17.5px; font-size: 18.75px; }

  pre {
    padding: 12.5px 15px;
    font-size: 15.625px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  pre code { white-space: pre; }

  table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    font-size: 17.5px;
  }
  th, td { padding: 7.5px 10px; }

  .afterword { padding: 22.5px 22.5px; margin: 45px 0 27.5px; }
  .afterword h4 { font-size: 22.5px; }
}

@media (max-width: 480px) {
  main { padding: 27.5px 15px 0; }
  body { font-size: 18.75px; }
  .masthead h1 { font-size: 30px; }
  .chapter-title { font-size: 23.75px; }
  .lede::first-letter { font-size: 2.8em; }
  .pull { font-size: 21.25px; }
  pre { padding: 10px 12.5px; font-size: 14.375px; }
}
</style>
