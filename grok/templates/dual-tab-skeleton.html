<!-- KaTeX (shared) — load deferred, render on DOMContentLoaded.
     Do not use `<script defer ... onload="renderMathInElement(...)">` here:
     `onload` fires the moment the script *file* finishes downloading, which
     can land mid-parse on long bodies (the dual-tab shell in particular).
     Everything still being parsed when that fires gets skipped — typically
     the entire second tab. DOMContentLoaded waits for the parser to finish.
     If you change the delimiter set or `ignoredTags` here, mirror the same
     change in bird-skeleton.html and frog-skeleton.html so single-style
     output behaves identically to dual-tab output. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    renderMathInElement(document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
      ignoredClasses: ['no-katex']
    });
  });
</script>

<!-- Prism (light theme, shared across both tabs) -->

<style>
  /* ============================================================
     Shell-level styles (apply to both tabs)
     ============================================================ */
  :root {
    --shell-ink: #1a1a1a;
    --shell-ink-soft: #555;
    --shell-rule: #d8d2c2;
    --shell-bg: #f4ecdd;
    --shell-accent: #c0392b;
  }
  html, body { margin: 0; padding: 0; }
  body { background: var(--shell-bg); color: var(--shell-ink); font-family: 'Inter', system-ui, sans-serif; }

  /* Tab bar — sticky top, theme-aware via `:has()`.
     Default (bird active): warm-paper bar, warm-red active button.
     When frog is active:    off-white bar, notebook-blue active button.
     The shift gives each view a coherent surface from masthead down. */
  .tabbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--shell-bg);
    border-bottom: 1.25px solid var(--shell-rule);
    padding: 15px 30px;
    display: flex; align-items: center; gap: 20px;
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 160ms ease, border-bottom-color 160ms ease;
  }
  .tabbar .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-size: 20px; color: var(--shell-ink);
    margin-right: auto;
    transition: color 160ms ease;
  }
  .tabbar .tabs { display: flex; gap: 10px; }
  .tab-btn {
    background: transparent; border: 1.25px solid var(--shell-rule);
    padding: 7.5px 17.5px; font-family: 'JetBrains Mono', monospace;
    font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--shell-ink-soft); cursor: pointer;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .tab-btn:hover { color: var(--shell-ink); border-color: var(--shell-ink); }
  /* Default active = bird → warm-red accent. */
  .tab-btn.active {
    background: var(--shell-accent);
    color: #fff;
    border-color: var(--shell-accent);
  }
  /* When frog tab is active, the bar follows the notebook surface. */
  body:has(#tab-frog.active) .tabbar {
    background: #fafafa;
    border-bottom-color: #e5e7eb;
  }
  body:has(#tab-frog.active) .tabbar .brand { color: #374151; }
  body:has(#tab-frog.active) .tab-btn { border-color: #d1d5db; color: #6b7280; }
  body:has(#tab-frog.active) .tab-btn:hover { color: #111827; border-color: #111827; }
  body:has(#tab-frog.active) .tab-btn.active {
    background: #4b78cc;
    color: #fff;
    border-color: #4b78cc;
  }

  /* Tab panes */
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* Editor-note for dropped-tab mode (see SKILL.md Dual-tab principle 3) */
  .tab-omitted-note {
    max-width: 1100px; margin: 30px auto; padding: 15px 22.5px;
    border-left: 3.75px solid var(--shell-ink-soft);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-size: 18.75px; color: var(--shell-ink-soft);
    background: rgba(255,255,255,0.4);
  }

  /* ============================================================
     bird-scoped styles — paste bird-skeleton.html CSS here.
     Wrap every selector under `.tab-bird ...`.
     ============================================================ */
  .tab-bird {
    /* page-level rules from bird-skeleton (body bg, type stack, etc.) */
    /* PASTE BIRD CSS HERE, namespaced */
  }

  /* ============================================================
     frog-scoped styles — paste frog-skeleton.html CSS here.
     Wrap every selector under `.tab-frog ...`.
     ============================================================ */
  .tab-frog {
    /* page-level rules from frog-skeleton (body bg, type stack, etc.) */
    /* PASTE FROG CSS HERE, namespaced */
  }

  /* ============================================================
     Narrow-screen (iPhone / mobile) — additive only. The tab bar
     here uses button-style chips ("🐦 Bird view · 抽象先行" labels
     are long, so we must keep them on one line and allow horizontal
     scroll instead of letting "鸟/瞰" split character-by-character.
     The bird / frog body rules (pasted in above) are responsible
     for their own mobile tightening — see bird-skeleton.html and
     frog-skeleton.html for the per-tab @media blocks.
     ============================================================ */
  @media (max-width: 720px) {
    .tabbar {
      padding: 12.5px 15px;
      gap: 12.5px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabbar::-webkit-scrollbar { display: none; }
    .tabbar .brand {
      font-size: 17.5px;
      flex-shrink: 0;
      margin-right: 10px;
      white-space: nowrap;
    }
    .tabbar .tabs { gap: 7.5px; flex-shrink: 0; }
    .tab-btn {
      padding: 6.25px 12.5px;
      font-size: 13.75px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-omitted-note {
      margin: 22.5px 15px;
      padding: 12.5px 17.5px;
      font-size: 17.5px;
    }
  }
  @media (max-width: 480px) {
    .tabbar { padding: 10px 12.5px; gap: 7.5px; }
    .tabbar .brand { font-size: 16.25px; margin-right: 5px; }
    .tab-btn { padding: 5px 11.25px; font-size: 13.125px; }
  }
</style>

<script>
  // Tab switching + hash routing.
  // - #bird-<slug>  → activate bird tab, scroll to #bird-<slug>
  // - #frog-<slug>  → activate frog tab, scroll to #frog-<slug>
  // - Legacy hashes #mit-<slug> / #stanford-<slug> are remapped to
  //   #bird-<slug> / #frog-<slug> so old links keep working.
  // - No hash       → bird tab active (default).
  (function () {
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');
    // Independent scroll per tab: each pane remembers its own scroll position,
    // so switching tabs never carries one tab's scroll into the other.
    const scrollMem = { 'tab-bird': 0, 'tab-frog': 0 };

    function activate(paneId) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.target === paneId));
      panes.forEach(p => p.classList.toggle('active', p.id === paneId));
    }

    tabs.forEach(t => t.addEventListener('click', () => {
      const cur = document.querySelector('.tab-pane.active');
      if (cur) scrollMem[cur.id] = window.scrollY;   // stash where we're leaving
      const target = t.dataset.target;
      activate(target);
      window.scrollTo(0, scrollMem[target] || 0);    // restore where we last were
    }));

    function syncFromHash() {
      let h = location.hash.slice(1);
      if (!h) return;
      // Legacy alias remapping — old MIT/Stanford anchor links keep working
      if (h.startsWith('mit-'))      h = 'bird-' + h.slice(4);
      if (h.startsWith('stanford-')) h = 'frog-' + h.slice(9);
      let target = null;
      if (h.startsWith('bird-')) target = 'tab-bird';
      else if (h.startsWith('frog-')) target = 'tab-frog';
      if (!target) return;
      activate(target);
      // wait one frame so display:block settles before scrollIntoView
      requestAnimationFrame(() => {
        const el = document.getElementById(h);
        if (el) el.scrollIntoView({ block: 'start' });
      });
    }
    window.addEventListener('hashchange', syncFromHash);
    syncFromHash();
  })();
</script>

</body>
