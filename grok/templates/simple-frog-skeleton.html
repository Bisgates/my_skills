<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!-- title (Chinese) --></title>

<!--
  ============================================================
  simple-frog-skeleton — the new default visual layer for frog.

  Visual contract: macOS system font stack + warm-paper palette +
  frog-pedagogy notebook markers (cell.md / cell.code / cell.out
  with mono labels, code-bg on input, gold border on output,
  stop-and-think callouts). ZERO external assets — no Google
  Fonts, no KaTeX, no Prism.

  Read references/visual/simple.md + references/pedagogy/frog.md
  before filling this in. visual/simple.md owns the look (palette,
  fonts, required components); pedagogy/frog.md owns the voice
  (code before abstraction, spelled out, stop-and-think pauses,
  lowercase conversational openers).

  KaTeX is intentionally absent. If the source has heavy LaTeX,
  either pass --math (the renderer adds the KaTeX CDN block back)
  or rerun with --visual magazine.
  ============================================================
-->

<style>
:root {
  --paper:        #f0eee6;
  --paper-2:      #e8e6dc;
  --ink:          #1f1a14;
  --ink-soft:     #3b332a;
  --ink-faint:    #6b6052;
  --rule:         #b8a583;
  --rule-soft:    #d8c9a2;
  --accent:       #8c2f1c;
  --accent-2:     #2c5340;
  --gold:         #a37c2a;
  --quote-bg:     #f0e6cd;
  --code-bg:      #efe6ce;
  --code-fg:      #1a140d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
  font-size: 22.5px; line-height: 1.7;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 6em; }
.mono, code, pre {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}

main { max-width: 1025px; margin: 0 auto; padding: 70px 40px 0; }

/* ============================================================
   Title block (notebook head)
   ============================================================ */
.nb-head {
  border-bottom: 2.5px solid var(--ink-soft);
  padding: 0 0 22.5px;
  margin-bottom: 32.5px;
}
.nb-head .stamp {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 15px; color: var(--ink-faint);
  letter-spacing: 0.05em;
}
.nb-head h1 {
  margin: 7.5px 0 5px; font-size: 37.5px; font-weight: 500;
}
.nb-head .sub {
  font-style: italic; color: var(--ink-soft); font-size: 20px;
}

/* ============================================================
   Section headings — mono small-caps, NOT Roman numerals
   ============================================================ */
h2.section {
  font-size: 22.5px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-variant: small-caps; letter-spacing: 0.14em;
  color: var(--accent-2);
  margin: 52.5px 0 12.5px;
  padding: 0 0 5px;
  border-bottom: 1.25px solid var(--rule);
  display: flex; align-items: baseline; gap: 15px;
}
h2.section .num {
  color: var(--ink-faint);
  font-size: 15px;
}
h3.subsection {
  font-size: 20px; font-weight: 500;
  color: var(--ink-soft);
  margin: 27.5px 0 7.5px;
}

/* ============================================================
   Cells (the page's spine: md / code / out)
   ============================================================ */
.cell {
  margin: 17.5px 0;
  border-left: 5px solid transparent;
  padding-left: 17.5px;
}
.cell.md   { border-color: var(--rule); }
.cell.code { border-color: var(--accent-2); }
.cell.out  { border-color: var(--gold); }
.cell .label {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px;
  color: var(--ink-faint);
  margin-bottom: 5px;
  letter-spacing: 0.04em;
}
.cell.code pre {
  background: var(--code-bg);
  padding: 15px 17.5px;
  font-size: 16.25px; line-height: 1.55;
  overflow-x: auto;
  margin: 0;
}
.cell.out pre {
  background: transparent;
  padding: 7.5px 0 0;
  font-size: 16.25px; line-height: 1.55;
  margin: 0;
  color: var(--ink-soft);
  white-space: pre-wrap;
}
.cell.md p { margin: 0 0 10px; }

/* ============================================================
   Inline code + standalone pre fallback
   ============================================================ */
code {
  background: var(--code-bg);
  padding: 1.25px 6.25px; border-radius: 2.5px;
  font-size: 0.86em;
}

/* ============================================================
   Stop & think callout (frog signature)
   ============================================================ */
.stop {
  background: rgba(44,83,64,0.06);
  border-left: 5px solid var(--accent-2);
  padding: 15px 20px; margin: 22.5px 0;
  font-size: 19.375px;
}
.stop .h {
  font-variant: small-caps; letter-spacing: 0.12em;
  font-size: 15px; color: var(--accent-2); margin-bottom: 5px;
}

/* ============================================================
   Generic callouts (default / warn / red / green)
   ============================================================ */
.callout {
  border-left: 3.75px solid var(--ink-faint);
  background: var(--paper-2);
  padding: 15px 20px; margin: 22.5px 0;
  font-size: 19.375px;
}
.callout .tag {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 5px;
}
.callout.warn  { border-color: var(--gold); }
.callout.warn  .tag { color: var(--gold); }
.callout.red   { border-color: var(--accent); background: rgba(140,47,28,0.05); }
.callout.red   .tag { color: var(--accent); }
.callout.green { border-color: var(--accent-2); background: rgba(44,83,64,0.05); }
.callout.green .tag { color: var(--accent-2); }

/* ============================================================
   Numeric punchline grid
   ============================================================ */
.nums {
  display: grid; gap: 15px;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  margin: 22.5px 0;
}
.nums .num-box {
  border: 1.25px solid var(--rule);
  background: var(--paper-2);
  padding: 12.5px 17.5px;
}
.nums .k {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.nums .v {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 27.5px; font-weight: 500;
  color: var(--ink);
}

/* ============================================================
   Tables (notebook-style: minimal rules, mono numerics)
   ============================================================ */
table.tbl {
  width: 100%; border-collapse: collapse;
  margin: 22.5px 0; font-size: 17.5px;
}
table.tbl th, table.tbl td {
  border-bottom: 1.25px solid var(--rule-soft);
  padding: 7.5px 12.5px; text-align: left;
}
table.tbl th {
  border-bottom: 1.875px solid var(--rule);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13.75px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-faint);
}
table.tbl td.num {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  text-align: right;
}

/* ============================================================
   Footer
   ============================================================ */
.nb-foot {
  margin-top: 70px; padding-top: 17.5px;
  border-top: 1.25px solid var(--rule);
  font-size: 16.25px; color: var(--ink-faint); font-style: italic;
}

/* ============================================================
   Uncertainty marker
   ============================================================ */
.uncertain {
  border-left: 3.75px dashed var(--accent);
  background: rgba(140,47,28,0.04);
  padding: 12.5px 17.5px; margin: 22.5px 0;
  font-style: italic; color: var(--ink-soft);
}

/* responsive */
@media (max-width: 640px) {
  main { padding: 40px 22.5px 0; }
  .nb-head h1 { font-size: 30px; }
}

/* ============================================================
   Narrow-screen (iPhone / mobile) — additive only. Preserve the
   In/Out cell rhythm; just tighten padding and let code cells
   scroll horizontally for long lines.
   ============================================================ */
@media (max-width: 720px) {
  main { padding: 35px 17.5px 0; max-width: 100%; }
  body { font-size: 20px; line-height: 1.6; }

  .nb-head { padding-bottom: 17.5px; margin-bottom: 27.5px; }
  .nb-head h1 { font-size: 27.5px; }
  .nb-head .sub { font-size: 18.75px; }

  h2.section { font-size: 20px; margin: 40px 0 10px; letter-spacing: 0.1em; }
  h3.subsection { font-size: 18.75px; }

  .cell { padding-left: 12.5px; margin: 15px 0; }
  .cell.code pre,
  .cell.out pre {
    padding: 12.5px 15px;
    font-size: 15px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .cell.code pre { white-space: pre; }

  .stop { padding: 12.5px 17.5px; font-size: 18.125px; margin: 17.5px 0; }
  .callout { padding: 12.5px 17.5px; font-size: 18.125px; margin: 17.5px 0; }

  .nums {
    gap: 12.5px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .nums .num-box { padding: 10px 15px; }
  .nums .v { font-size: 22.5px; }

  table.tbl {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    font-size: 16.25px;
  }
  table.tbl th, table.tbl td { padding: 6.25px 10px; }
}

@media (max-width: 480px) {
  main { padding: 27.5px 15px 0; }
  body { font-size: 18.75px; }
  .nb-head h1 { font-size: 25px; }
  h2.section { font-size: 18.75px; }
  .cell.code pre,
  .cell.out pre { padding: 10px 12.5px; font-size: 14.375px; }
  .nums { grid-template-columns: repeat(2, 1fr); }
  .nums .v { font-size: 20px; }
}
</style>
</head>
<body>

<main>

<!-- ============ TITLE BLOCK ============ -->
<header class="nb-head">
  <div class="stamp"><!-- e.g. "notebook · X · spelled out from scratch · 2026-05" --></div>
  <h1><!-- title (Chinese) --></h1>
  <div class="sub"><!-- one-line italic subtitle (Chinese) --></div>
</header>

<!-- ============ COLD OPEN ============ -->
<!-- The very first content under the title MUST be a code cell + output cell
     pair (frog principle: example before abstraction). Not a TOC, not an abstract.
     Code first; what the code does to stdout second; narrative third. -->

<div class="cell code">
  <div class="label">In [1]:</div>
  <pre><code><!-- the actual code / command being explained --></code></pre>
</div>

<div class="cell out">
  <div class="label">Out [1]:</div>
  <pre><!-- byte-for-byte stdout from a real run; or clearly mark "typical" / "illustrative" if synthesized --></pre>
</div>

<div class="cell md">
  <div class="label">In [md]:</div>
  <p>okay 接下来我们从零开始把这段拆开看一遍 —— <!-- agent-voice transition. Lowercase, conversational. Name the sections that follow. --></p>
</div>

<!-- ============ NUMERIC PUNCHLINE ============ -->
<div class="nums">
  <div class="num-box"><div class="k"><!-- label --></div><div class="v"><!-- value --></div></div>
  <div class="num-box"><div class="k"><!-- label --></div><div class="v"><!-- value --></div></div>
  <div class="num-box"><div class="k"><!-- label --></div><div class="v"><!-- value --></div></div>
  <div class="num-box"><div class="k"><!-- label --></div><div class="v"><!-- value --></div></div>
</div>

<!-- ============ SECTION 1 ============ -->
<h2 class="section" id="frog-<!-- slug-1 -->"><span class="num">[1]</span><!-- section 1 name (Chinese) --></h2>

<div class="cell md">
  <div class="label">In [md]:</div>
  <p><!-- narration: lowercase, conversational. set up what the next cell will do. --></p>
</div>

<div class="cell code">
  <div class="label">In [2]:</div>
  <pre><code><!-- next concrete step's code --></code></pre>
</div>

<div class="cell out">
  <div class="label">Out [2]:</div>
  <pre><!-- output --></pre>
</div>

<div class="cell md">
  <div class="label">In [md]:</div>
  <p><!-- what just happened? Name the takeaway in one sentence. --></p>
</div>

<div class="stop">
  <div class="h">stop &amp; think</div>
  <!-- a short non-obvious observation: a trap, a "wait, what would happen if…", or a soft analogy to something the reader has already written. -->
</div>

<!-- ============ SECTION 2 ============ -->
<h2 class="section" id="frog-<!-- slug-2 -->"><span class="num">[2]</span><!-- section 2 name --></h2>

<h3 class="subsection"><!-- optional subsection heading --></h3>

<div class="cell code">
  <div class="label">In [3]:</div>
  <pre><code><!-- code --></code></pre>
</div>

<div class="cell md">
  <div class="label">In [md]:</div>
  <p><!-- narration: the spelled-out step. one cell does one thing. --></p>
</div>

<div class="callout green">
  <div class="tag">类比</div>
  <!-- an analogy to something the reader has already written or already understands. Keep it tight. -->
</div>

<!-- ============ SECTION 3 (worked example or comparison) ============ -->
<h2 class="section" id="frog-<!-- slug-3 -->"><span class="num">[3]</span><!-- section 3 name --></h2>

<div class="cell md">
  <div class="label">In [md]:</div>
  <p><!-- 引入 worked example. smallest concrete instance that exercises the concept. --></p>
</div>

<div class="cell code">
  <div class="label">In [4]:</div>
  <pre><code><!-- code that computes the example. tiny numbers (1, 2, 0, ½, π/4). --></code></pre>
</div>

<div class="cell out">
  <div class="label">Out [4]:</div>
  <pre><!-- output --></pre>
</div>

<div class="cell md">
  <div class="label">In [md]:</div>
  <p><strong>takeaway:</strong> <!-- the punchline of this example in one sentence. --></p>
</div>

<!-- ============ FOOTER ============ -->
<div class="nb-foot">
  notebook 结束。<!-- list source files used + "numbers verbatim from `command`" if applicable + any closing line that bridges to the bird tab if dual-tab. -->
</div>

</main>
