<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — arc {{ID}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --ink: #1c1917;        /* stone-900 */
    --ink-soft: #44403c;   /* stone-700 */
    --ink-mute: #78716c;   /* stone-500 */
    --paper: #fafaf9;      /* stone-50 */
    --rule: #e7e5e4;       /* stone-200 */
    --accent: #b45309;     /* amber-700 */
  }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: ui-serif, "Iowan Old Style", "Source Serif 4", "Songti SC", "PingFang SC", serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.7;
  }
  .ui { font-family: ui-sans-serif, "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  .display {
    font-family: ui-serif, "Iowan Old Style", "Source Serif 4", "Songti SC", "PingFang SC", serif;
    letter-spacing: -0.01em;
  }
  h1.title { font-weight: 700; font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.15; }
  h2.section {
    font-weight: 600; font-size: 1.5rem; line-height: 1.25;
    border-top: 1px solid var(--rule); padding-top: 1.25rem; margin-top: 3rem;
  }
  .eyebrow { letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.7rem; color: var(--ink-mute); }
  .lede { font-size: 1.1rem; color: var(--ink-soft); }
  .metric .num { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 2.25rem; line-height: 1; color: var(--ink); }
  .metric .lbl { color: var(--ink-mute); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .metric .delta-up { color: #166534; }
  .metric .delta-down { color: #991b1b; }
  .accent { color: var(--accent); }
  .rule-soft { border-color: var(--rule); }
  .pill { display:inline-block; padding: 0.1rem 0.55rem; border: 1px solid var(--rule); border-radius: 999px; font-size: 0.72rem; color: var(--ink-mute); }
  a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.88em; background: rgba(180,83,9,0.07); padding: 0.05rem 0.3rem; border-radius: 4px; }
  table.artifacts { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  table.artifacts td, table.artifacts th { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.artifacts th { font-weight: 600; color: var(--ink-mute); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }
  table.artifacts code { background: transparent; padding: 0; color: var(--ink-soft); }
  blockquote.aside { border-left: 2px solid var(--accent); padding: 0.25rem 1rem; color: var(--ink-soft); font-style: italic; }
</style>
</head>
<body>

<!--
  Reporter sub-agent: this file is the SKELETON.
  Copy it to <arc>/7_task_report.html, then replace tokens and FILL blocks.

  Tokens: {{TITLE}} {{SUBTITLE}} {{ID}} {{DATE}}
    TITLE    = the arc's brief, prose-cleaned (e.g. "把 board view 接到 Linear API")
    SUBTITLE = one-line problem statement, ≤ 18 字
    ID       = 7-char arc id (e.g. 260512c)
    DATE     = report generation date in YYYY-MM-DD

  Section budget (the whole report should feel light — closer to a one-pager
  than a long essay):
    §1 结果      mandatory; the headline number(s) + did we hit acceptance.
    §2 过程      mandatory; SHORT narrative, 3-5 short paragraphs max.
    §3+         free-form; pick what is actually worth saying. Skip what is not.
                Common useful ones: 关键决策 / 留下的产物 / 学到的东西 / 接下来.
                Add at most 3-4 free sections. Each one short. Do NOT pad.
-->

<header class="max-w-3xl mx-auto px-6 pt-16 pb-8">
  <p class="ui eyebrow mb-3">arc {{ID}} · {{DATE}}</p>
  <h1 class="display title mb-3">{{TITLE}}</h1>
  <p class="lede">{{SUBTITLE}}</p>
</header>

<main class="max-w-3xl mx-auto px-6 pb-24">

  <!--
    §1 结果 — 这是封面式的一章。读者翻开第一眼就要知道：成了/没成、关键数字、对照验收。
    建议组件：
      a) 一句话定调 (e.g. "L1 指标达标，L2 可视化提交；可以 finalize。")
      b) 1-3 个 metric 卡片 (.metric)，每个有数字 + 标签 + 可选 delta。
         数字偏大、单位小字。如果验收靠的是图/产物而不是数字，用一行说明 + 链接代替卡片。
      c) 短结论一句 (e.g. "未达标项: none / 见 follow-ups")。
    不要写过程；过程在 §2。
  -->
  <section class="mt-2">
    <h2 class="section display">1. 结果</h2>

    <p class="lede mb-6"><!-- FILL: 一句话定调 — 成/没成 + 整体感觉 --></p>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-6">
      <!-- FILL: 1-3 个 metric 卡片。模板如下，按需复用/删除。
      <div class="metric">
        <div class="num">31.4</div>
        <div class="lbl">PSNR (dB)</div>
        <div class="delta-up text-xs mt-1">↑ vs target 30.0</div>
      </div>
      -->
    </div>

    <p class="text-base text-stone-700"><!-- FILL: 1-2 句结论 — 是否达成验收 / 留了哪些尾巴 --></p>
  </section>

  <!--
    §2 过程 — 简短叙事。读者在这里要 "看完一眼就懂我们走的路径"。
    硬要求 SHORT：3-5 段，每段 ≤ 3 句。不要复述 0_meta.md 的 log；提炼。
    建议骨架：
      - 起点：当时面对的状况 / 为什么这么做。
      - 主路径：走了哪条主线，过了 smoke、跑了正式实验。
      - 拐点：途中是否换了方向或踩过坑（有就写，没有就跳过）。
      - 收尾：以什么状态停下。
    避免长代码块；遇到 "代码就是 lesson 本身" 的少数情况再贴小段。
  -->
  <section>
    <h2 class="section display">2. 过程</h2>

    <div class="space-y-4 text-stone-800">
      <p><!-- FILL: 起点 --></p>
      <p><!-- FILL: 主路径 --></p>
      <!-- FILL: (可选) 拐点 -->
      <p><!-- FILL: 收尾 --></p>
    </div>
  </section>

  <!--
    §3+ 自由发挥（轻）— 按下列候选挑 0-4 个写，每个短。挑标准：是否真的值得说。
    候选模板都在下面注释里；用得上就解注、删 FILL；用不上就整段删除。

    总体提醒：宁缺毋滥。一个干瘪的 "学到的东西" 章节比没有更糟。
  -->

  <!-- 候选 A：关键决策（途中有过明显选择时启用）
  <section>
    <h2 class="section display">3. 关键决策</h2>
    <ul class="space-y-3 text-stone-800">
      <li><strong>FILL: 决策一句话</strong> — FILL: 选了什么，为什么。</li>
    </ul>
  </section>
  -->

  <!-- 候选 B：留下的产物（output/ 下有真值得指路的东西时启用）
  <section>
    <h2 class="section display">_. 留下的产物</h2>
    <table class="artifacts">
      <thead><tr><th>路径</th><th>是什么</th></tr></thead>
      <tbody>
        <tr><td><code>output/FILL/</code></td><td>FILL</td></tr>
      </tbody>
    </table>
  </section>
  -->

  <!-- 候选 C：学到的东西（有非显然的 lesson 时启用 — 不是流水账）
  <section>
    <h2 class="section display">_. 学到的东西</h2>
    <ul class="space-y-2 text-stone-800 list-disc list-inside">
      <li>FILL</li>
    </ul>
  </section>
  -->

  <!-- 候选 D：接下来（有真要追的尾巴时启用）
  <section>
    <h2 class="section display">_. 接下来</h2>
    <ul class="space-y-2 text-stone-800 list-disc list-inside">
      <li>FILL</li>
    </ul>
  </section>
  -->

  <footer class="mt-20 pt-6 border-t rule-soft text-stone-500 text-sm ui flex justify-between">
    <span>arc {{ID}}</span>
    <span>generated {{DATE}}</span>
  </footer>
</main>

</body>
</html>
