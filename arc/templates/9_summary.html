<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} — arc {{ID}}</title>

<!--
  Reporter sub-agent: this file is the SKELETON.
  Copy it to <arc>/9_summary.html, then replace tokens and FILL blocks.

  Visual contract = grok's "simple" theme (see
  ~/.claude/skills/grok/references/styles/visual-simple.md):
    - warm-paper palette (the :root tokens below — keep them all)
    - macOS system font stack (no Google Fonts)
    - ZERO external CDN (no Tailwind, no KaTeX, no Prism)
    - all CSS inline in this one <style> block
  Don't reintroduce CDN deps. The arc summary is a report, not a paper —
  it should double-click open offline forever.

  This is the arc's DONE-state artifact. The `arc status <id> done` gate
  requires <arc>/9_summary.html to exist and be non-empty. Two entry points
  produce it (same template, same reporter sub-agent):
    - Fast-done path (end of /arc-execute, trivial arcs): main agent asks
      the user to confirm, then dispatches the reporter. No 8_handoff_plan.md
      exists; the 留下的产物 / 接下来 sections come from the arc itself.
    - Formal finalize path (/arc-finalize Stage 2): after promotion completes,
      the reporter pulls promoted-code / doc-changes from 8_handoff_plan.md
      and surfaces them in 留下的产物 / 接下来.

  Tokens: {{TITLE}} {{SUBTITLE}} {{ID}} {{DATE}}
    TITLE    = the arc's brief, prose-cleaned (e.g. "把 board view 接到 Linear API")
    SUBTITLE = one-line problem statement, ≤ 18 字
    ID       = 7-char arc id (e.g. 260512c)
    DATE     = summary generation date in YYYY-MM-DD

  Section budget (the whole summary should feel light — closer to a one-pager
  than a long essay):
    §1 结果      mandatory; the headline number(s) + did we hit acceptance.
    §2 过程      mandatory; SHORT narrative, 3-5 short paragraphs max.
    §3+         free-form; pick what is actually worth saying. Skip what is not.
                Common useful ones: 关键决策 / 留下的产物 / 学到的东西 / 接下来.
                Add at most 3-4 free sections. Each one short. Do NOT pad.

  Section numbering: §1 → "I", §2 → "II", §3+ → "III / IV / V" via
  .chapter-rule. The Roman numeral is the simple-visual section marker;
  keep it for every section.
-->

<style>
:root {
  --paper:        #fbf6e9;
  --paper-2:      #f3ebd6;
  --ink:          #1f1a14;
  --ink-soft:     #3b332a;
  --ink-faint:    #6b6052;
  --rule:         #b8a583;
  --rule-soft:    #d8c9a2;
  --accent:       #8c2f1c;
  --accent-2:     #2c5340;
  --gold:         #a37c2a;
  --quote-bg:     #f0e6cd;
  --code-bg:      #efe6ce;
  --code-fg:      #1a140d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Iowan Old Style", "Charter", "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-size: 18px; line-height: 1.7;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 5em; }
.mono, code, pre {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}

main { max-width: 760px; margin: 0 auto; padding: 56px 32px 0; }

/* Masthead */
.masthead {
  text-align: center;
  border-top: 4px double var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 30px 0 22px;
  margin-bottom: 32px;
}
.masthead .kicker {
  font-variant: small-caps;
  letter-spacing: 0.28em;
  font-size: 12px;
  color: var(--accent);
}
.masthead h1 {
  font-size: 40px; line-height: 1.18; margin: 12px 0 8px;
  font-weight: 500;
}
.masthead .deck {
  font-style: italic; color: var(--ink-soft);
  font-size: 18px; max-width: 600px; margin: 0 auto;
}

/* Section openers — Roman numeral between rules */
.chapter-rule {
  text-align: center;
  margin: 56px 0 22px;
  color: var(--accent);
  font-variant: small-caps;
  letter-spacing: 0.3em;
}
.chapter-rule .roman {
  display: inline-block;
  font-size: 20px;
  font-style: italic;
  padding: 0 16px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  line-height: 2;
}
.chapter-title {
  text-align: center;
  font-size: 24px;
  font-style: italic;
  font-weight: 500;
  margin: 0 0 24px;
  color: var(--ink);
}

/* Body prose */
section p { margin: 0 0 1em; color: var(--ink); }
.lede { font-size: 1.08rem; color: var(--ink-soft); }
.lede::first-letter {
  float: left;
  font-size: 4.2em; line-height: 0.9;
  padding: 0.08em 0.1em 0 0;
  color: var(--accent);
  font-weight: 500;
}
.conclusion { color: var(--ink-soft); font-style: italic; }

/* Metric cards (§1) */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  margin: 24px 0;
}
.metric {
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  padding: 18px 20px;
}
.metric .num {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-weight: 600;
  font-size: 2rem; line-height: 1;
  color: var(--ink);
}
.metric .lbl {
  color: var(--ink-faint);
  font-size: 0.72rem; letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 8px;
}
.metric .delta { font-size: 0.78rem; margin-top: 6px; }
.metric .delta-up { color: var(--accent-2); }
.metric .delta-down { color: var(--accent); }

/* Callout (key decisions, asides) */
.callout {
  background: var(--paper-2);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  margin: 18px 0;
}
.callout .ctitle {
  font-variant: small-caps;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-size: 12px;
  margin-bottom: 6px;
}
.callout p { margin: 0; }

/* Decision list */
.decisions { list-style: none; padding: 0; margin: 0; }
.decisions > li {
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-soft);
}
.decisions > li:last-child { border-bottom: 0; }
.decisions strong { color: var(--ink); }

/* Artifact table */
table.artifacts {
  width: 100%; border-collapse: collapse;
  font-size: 0.95rem;
  margin: 16px 0;
}
table.artifacts th,
table.artifacts td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule-soft);
  vertical-align: top;
}
table.artifacts th {
  font-variant: small-caps;
  letter-spacing: 0.06em;
  font-weight: 500;
  color: var(--accent);
  font-size: 0.78rem;
  border-bottom: 1px solid var(--rule);
}
table.artifacts code { background: transparent; padding: 0; color: var(--ink-soft); }

/* Inline elements */
code {
  font-size: 0.88em;
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 0.05rem 0.32rem;
  border-radius: 3px;
}
pre {
  background: var(--code-bg);
  color: var(--code-fg);
  border-left: 3px solid var(--gold);
  padding: 14px 16px;
  overflow-x: auto;
  font-size: 0.92rem;
  margin: 16px 0;
}
pre code { background: transparent; padding: 0; }
a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
ul, ol { padding-left: 1.4em; }
ul li, ol li { margin: 0.35em 0; }

/* Footer */
footer.colophon {
  max-width: 760px; margin: 56px auto 0; padding: 18px 32px 0;
  border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px; letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
</style>
</head>
<body>

<main>

  <header class="masthead">
    <div class="kicker">arc {{ID}} · {{DATE}}</div>
    <h1>{{TITLE}}</h1>
    <div class="deck">{{SUBTITLE}}</div>
  </header>

  <!--
    §1 结果 — 这是封面式的一章。读者翻开第一眼就要知道：成了/没成、关键数字、对照验收。
    建议组件：
      a) 一句话定调（lede，自带 drop cap）。
      b) 1-3 个 metric 卡片，每个有数字 + 标签 + 可选 delta。
         如果验收靠的是图/产物而不是数字，整段 .metrics 删掉，用一行说明 + 链接代替。
      c) 短结论一句（.conclusion）。
    不要写过程；过程在 §2。
  -->
  <section>
    <div class="chapter-rule"><span class="roman">I · 结果</span></div>

    <p class="lede"><!-- FILL: 一句话定调 — 成/没成 + 整体感觉 --></p>

    <div class="metrics">
      <!-- FILL: 1-3 个 metric 卡片。模板如下，按需复用/删除。
      <div class="metric">
        <div class="num">31.4</div>
        <div class="lbl">PSNR (dB)</div>
        <div class="delta delta-up">↑ vs target 30.0</div>
      </div>
      -->
    </div>

    <p class="conclusion"><!-- FILL: 1-2 句结论 — 是否达成验收 / 留了哪些尾巴 --></p>
  </section>

  <!--
    §2 过程 — 简短叙事。读者在这里要 "看完一眼就懂我们走的路径"。
    硬要求 SHORT：3-5 段，每段 ≤ 3 句。不要复述 0_meta.md 的 log；提炼。
    建议骨架：
      - 起点：当时面对的状况 / 为什么这么做。
      - 主路径：走了哪条主线，过了 smoke、跑了正式实验。
      - 拐点：途中是否换了方向或踩过坑（有就写，没有就跳过）。
      - 收尾：以什么状态停下。
    避免长代码块；遇到 "代码就是 lesson 本身" 的少数情况再贴小段。
  -->
  <section>
    <div class="chapter-rule"><span class="roman">II · 过程</span></div>

    <p><!-- FILL: 起点 --></p>
    <p><!-- FILL: 主路径 --></p>
    <!-- FILL: (可选) 拐点 -->
    <p><!-- FILL: 收尾 --></p>
  </section>

  <!--
    §3+ 自由发挥（轻）— 按下列候选挑 0-4 个写，每个短。挑标准：是否真的值得说。
    候选模板都在下面注释里；用得上就解注、删 FILL；用不上就整段删除。
    Roman 编号按出现顺序顺延（III · 关键决策 / IV · 留下的产物 / ...）。

    总体提醒：宁缺毋滥。一个干瘪的 "学到的东西" 章节比没有更糟。
  -->

  <!-- 候选 A：关键决策（途中有过明显选择时启用）
  <section>
    <div class="chapter-rule"><span class="roman">III · 关键决策</span></div>
    <ul class="decisions">
      <li><strong>FILL: 决策一句话</strong> — FILL: 选了什么，为什么。</li>
    </ul>
  </section>
  -->

  <!-- 候选 B：留下的产物（output/ 下有真值得指路的东西时启用）
  <section>
    <div class="chapter-rule"><span class="roman">_ · 留下的产物</span></div>
    <table class="artifacts">
      <thead><tr><th>路径</th><th>是什么</th></tr></thead>
      <tbody>
        <tr><td><code>output/FILL/</code></td><td>FILL</td></tr>
      </tbody>
    </table>
  </section>
  -->

  <!-- 候选 C：学到的东西（有非显然的 lesson 时启用 — 不是流水账）
  <section>
    <div class="chapter-rule"><span class="roman">_ · 学到的东西</span></div>
    <ul>
      <li>FILL</li>
    </ul>
  </section>
  -->

  <!-- 候选 D：接下来（有真要追的尾巴时启用）
  <section>
    <div class="chapter-rule"><span class="roman">_ · 接下来</span></div>
    <ul>
      <li>FILL</li>
    </ul>
  </section>
  -->

</main>

<footer class="colophon">
  <span>arc {{ID}}</span>
  <span>generated {{DATE}}</span>
</footer>

</body>
</html>
