<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} — arc {{ID}}</title>

<!--
  Reporter sub-agent: this file is the SKELETON.
  Copy it to <arc>/9_summary.html, then replace tokens and FILL blocks.

  Visual contract = light product-doc theme (Linear/Notion-like), shared with
  templates/1_objective.html:
    - neutral light palette (the :root tokens below — keep them all)
    - macOS system font stack (no Google Fonts)
    - ZERO external CDN (no Tailwind, no KaTeX, no Prism)
    - all CSS inline in this one <style> block
  Don't reintroduce CDN deps. The arc summary is a report, not a paper —
  it should double-click open offline forever.

  This is the arc's DONE-state artifact. The `arc status <id> done` gate
  requires <arc>/9_summary.html to exist and be non-empty. Two entry points
  produce it (same template, same reporter sub-agent):
    - Fast-done path (end of /arc-execute, trivial arcs): main agent asks
      the user to confirm, then dispatches the reporter. No 8_handoff_plan.md
      exists; the 留下的产物 / 接下来 sections come from the arc itself.
    - Formal finalize path (/arc-finalize Stage 2): after promotion completes,
      the reporter pulls promoted-code / doc-changes from 8_handoff_plan.md
      and surfaces them in 留下的产物 / 接下来.

  Tokens: {{TITLE}} {{SUBTITLE}} {{ID}} {{DATE}}
    TITLE    = the arc's brief, prose-cleaned (e.g. "把 board view 接到 Linear API")
    SUBTITLE = one-line problem statement, ≤ 18 字
    ID       = 7-char arc id (e.g. 260512c)
    DATE     = summary generation date in YYYY-MM-DD

  Section budget (the whole summary should feel light — closer to a one-pager
  than a long essay):
    01 结果      mandatory; the headline number(s) + did we hit acceptance.
    02 过程      mandatory; SHORT narrative, 3-5 short paragraphs max.
    03+         free-form; pick what is actually worth saying. Skip what is not.
                Common useful ones: 关键决策 / 留下的产物 / 学到的东西 / 接下来.
                Add at most 3-4 free sections. Each one short. Do NOT pad.

  Section numbering: 01 / 02 are fixed; free sections take 03 / 04 / 05 in
  order of appearance. The .sechead index is the section marker; keep it for
  every section.
-->

<style>
:root {
  --bg:         #fafafa;
  --card:       #ffffff;
  --border:     #e4e4e7;
  --border-hi:  #d4d4d8;
  --ink:        #18181b;
  --ink-soft:   #3f3f46;
  --ink-faint:  #71717a;
  --accent:     #5b5bd6;
  --accent-bg:  #eeeefc;
  --green:      #16a34a;
  --green-bg:   #ecfdf3;
  --blue:       #0369a1;
  --blue-bg:    #e0f2fe;
  --red:        #dc2626;
  --red-bg:     #fef2f2;
  --code-bg:    #f4f4f5;
  --shadow:     0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.05);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 17.5px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
.mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
main { max-width: 940px; margin: 0 auto; padding: 58px 32px 100px; }

/* Masthead */
.masthead { margin-bottom: 42px; }
.masthead .pills { display: flex; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 500;
  padding: 4px 12px; border-radius: 99px;
  background: var(--accent-bg); color: var(--accent);
}
.pill.neutral { background: var(--code-bg); color: var(--ink-faint); }
.pill.done { background: var(--green-bg); color: var(--green); }
.pill .dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.masthead h1 { font-size: 36px; line-height: 1.22; margin: 0 0 9px; font-weight: 650; letter-spacing: -0.022em; }
.masthead .deck { color: var(--ink-faint); font-size: 19px; }

/* Section header */
.sechead { display: flex; align-items: baseline; gap: 11px; margin: 46px 0 16px; }
.sechead .idx { font-size: 15px; font-weight: 600; color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.sechead h2 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }

section p { margin: 0 0 0.85em; }

/* §01 结果 — tone-setting lede → metric cards → short conclusion */
.lede { font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; line-height: 1.5; margin: 0 0 16px; }
.conclusion { color: var(--ink-faint); }

/* Card base */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow); }

/* Metric cards (§01) */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin: 16px 0;
}
.metric {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 11px; box-shadow: var(--shadow);
  padding: 17px 20px;
}
.metric .num {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-weight: 650;
  font-size: 1.9rem; line-height: 1.1;
  color: var(--ink);
}
.metric .lbl {
  color: var(--ink-faint);
  font-size: 12.5px; letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 7px;
}
.metric .delta { font-size: 13.5px; font-weight: 550; margin-top: 6px; }
.metric .delta-up { color: var(--green); }
.metric .delta-down { color: var(--red); }

/* §03+ 关键决策 — quiet note block, accent left bar, bold lead per row */
.decisions { margin: 13px 0; border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; }
.decisions .note { padding: 7px 0; font-size: 16px; color: var(--ink-soft); }
.decisions .note + .note { border-top: 1px dashed var(--border); }
.decisions .note .lead { font-weight: 600; color: var(--ink); margin-right: 6px; }

/* §03+ 留下的产物 — artifact table in a card */
.card.artifacts { padding: 6px 21px; margin: 13px 0; }
table.artifacts { width: 100%; border-collapse: collapse; font-size: 15.5px; }
table.artifacts th,
table.artifacts td {
  text-align: left;
  padding: 11px 14px 11px 0;
  border-top: 1px solid var(--code-bg);
  vertical-align: top;
  color: var(--ink-soft);
}
table.artifacts tr:first-child th { border-top: 0; }
table.artifacts th {
  font-size: 12.5px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-faint);
}
table.artifacts td code { color: var(--accent); background: transparent; padding: 0; }

/* §03+ 学到的东西 / 接下来 — plain list, light markers */
ul.plain { margin: 13px 0; padding: 0; list-style: none; }
ul.plain li { padding: 6px 0 6px 24px; position: relative; font-size: 16px; color: var(--ink-soft); }
ul.plain li::before { content: "—"; position: absolute; left: 0; top: 6px; color: var(--border-hi); font-weight: 600; }
ul.plain li .lead { font-weight: 600; color: var(--ink); margin-right: 6px; }

/* Inline elements */
code { font-size: 0.86em; background: var(--code-bg); padding: 0.12rem 0.38rem; border-radius: 5px; color: var(--ink-soft); }
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  font-size: 14.5px; line-height: 1.6;
  margin: 16px 0;
  color: var(--ink-soft);
}
pre code { background: transparent; padding: 0; }
a { color: var(--accent); text-decoration: none; }
strong { font-weight: 600; }
ul, ol { padding-left: 1.4em; }
ul li, ol li { margin: 0.35em 0; }

footer.colophon {
  max-width: 940px; margin: 0 auto; padding: 18px 32px 50px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12.5px; color: var(--ink-faint);
}
</style>
</head>
<body>

<main>

  <header class="masthead">
    <div class="pills">
      <span class="pill"><span class="dot"></span>arc {{ID}}</span>
      <span class="pill done">done</span>
      <span class="pill neutral">summary · {{DATE}}</span>
    </div>
    <h1>{{TITLE}}</h1>
    <div class="deck">{{SUBTITLE}}</div>
  </header>

  <!--
    01 结果 — 这是封面式的一章。读者翻开第一眼就要知道：成了/没成、关键数字、对照验收。
    建议组件：
      a) 一句话定调（.lede）。
      b) 1-3 个 metric 卡片，每个有数字 + 标签 + 可选 delta（delta-up 绿 / delta-down 红）。
         如果验收靠的是图/产物而不是数字，整段 .metrics 删掉，用一行说明 + 链接代替。
      c) 短结论一句（.conclusion）。
    不要写过程；过程在 02。
  -->
  <div class="sechead"><span class="idx">01</span><h2>结果</h2></div>
  <section>
    <p class="lede"><!-- FILL: 一句话定调 — 成/没成 + 整体感觉 --></p>

    <div class="metrics">
      <!-- FILL: 1-3 个 metric 卡片。模板如下，按需复用/删除。
      <div class="metric">
        <div class="num">31.4</div>
        <div class="lbl">PSNR (dB)</div>
        <div class="delta delta-up">↑ vs target 30.0</div>
      </div>
      -->
    </div>

    <p class="conclusion"><!-- FILL: 1-2 句结论 — 是否达成验收 / 留了哪些尾巴 --></p>
  </section>

  <!--
    02 过程 — 简短叙事。读者在这里要 "看完一眼就懂我们走的路径"。
    硬要求 SHORT：3-5 段，每段 ≤ 3 句。不要复述 0_meta.md 的 log；提炼。
    建议骨架：
      - 起点：当时面对的状况 / 为什么这么做。
      - 主路径：走了哪条主线，过了 smoke、跑了正式实验。
      - 拐点：途中是否换了方向或踩过坑（有就写，没有就跳过）。
      - 收尾：以什么状态停下。
    避免长代码块；遇到 "代码就是 lesson 本身" 的少数情况再贴小段。
  -->
  <div class="sechead"><span class="idx">02</span><h2>过程</h2></div>
  <section>
    <p><!-- FILL: 起点 --></p>
    <p><!-- FILL: 主路径 --></p>
    <!-- FILL: (可选) 拐点 -->
    <p><!-- FILL: 收尾 --></p>
  </section>

  <!--
    03+ 自由发挥（轻）— 按下列候选挑 0-4 个写，每个短。挑标准：是否真的值得说。
    候选模板都在下面注释里；用得上就解注、删 FILL；用不上就整段删除。
    .sechead 编号按出现顺序顺延（03 关键决策 / 04 留下的产物 / ...）。

    总体提醒：宁缺毋滥。一个干瘪的 "学到的东西" 章节比没有更糟。
  -->

  <!-- 候选 A：关键决策（途中有过明显选择时启用）
  <div class="sechead"><span class="idx">03</span><h2>关键决策</h2></div>
  <section>
    <div class="decisions">
      <div class="note"><span class="lead">FILL: 决策一句话</span>FILL: 选了什么，为什么。</div>
    </div>
  </section>
  -->

  <!-- 候选 B：留下的产物（output/ 下有真值得指路的东西时启用）
  <div class="sechead"><span class="idx">_</span><h2>留下的产物</h2></div>
  <section>
    <div class="card artifacts">
      <table class="artifacts">
        <thead><tr><th>路径</th><th>是什么</th></tr></thead>
        <tbody>
          <tr><td><code>output/FILL/</code></td><td>FILL</td></tr>
        </tbody>
      </table>
    </div>
  </section>
  -->

  <!-- 候选 C：学到的东西（有非显然的 lesson 时启用 — 不是流水账）
  <div class="sechead"><span class="idx">_</span><h2>学到的东西</h2></div>
  <section>
    <ul class="plain">
      <li>FILL</li>
    </ul>
  </section>
  -->

  <!-- 候选 D：接下来（有真要追的尾巴时启用）
  <div class="sechead"><span class="idx">_</span><h2>接下来</h2></div>
  <section>
    <ul class="plain">
      <li>FILL</li>
    </ul>
  </section>
  -->

</main>

<footer class="colophon">
  <span>arc {{ID}} · summary</span>
  <span>generated {{DATE}}</span>
</footer>

</body>
</html>
