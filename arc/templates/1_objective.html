<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1_objective — arc {{ID}}</title>

<!--
  /arc-objective: this file is the SKELETON for the locked objective.
  Copy it to <arc>/1_objective.html, then replace tokens and FILL blocks.

  Visual contract = grok's "simple" theme, same as templates/9_summary.html:
    - warm-paper palette (the :root tokens below — keep them all)
    - macOS system font stack (no Google Fonts)
    - ZERO external CDN (no Tailwind, no KaTeX, no Prism)
    - all CSS inline in this one <style> block
  The objective is a contract, not a paper — it should double-click open
  offline forever and feel of-a-piece with 9_summary.html.

  Tokens: {{ARC_NAME}} {{BRIEF}} {{ID}} {{DATE}}
    ARC_NAME = the arc's brief, prose-cleaned (also used as the <h1>)
    BRIEF    = one-line problem statement, ≤ 18 字 (deck under the title)
    ID       = 7-char arc id (e.g. 260512c)
    DATE     = lock date in YYYY-MM-DD

  Section spine (mirror 9_summary.html's Roman-numeral chapter rhythm):
    §I  目标         mandatory; one sentence, concrete verb, no fuzzy "investigate".
    §II 边界         mandatory; in-scope vs. non-goals.
    §III 验收        mandatory; L1 metric cards + L2 visual evidence.
    §IV 约束 / 假设   optional; only if there are real ones.
    §V  输入 / 依赖   mandatory; data / upstream arc / main-project code.
    §VI 风险         optional; only the genuine ones — do not invent risks.

  Write decisions only, not the dialogue transcript. After locking, avoid
  repeated edits; goal changes are expressed via 4_pivot.md or a new arc.
-->

<style>
:root {
  --paper:        #fbf6e9;
  --paper-2:      #f3ebd6;
  --ink:          #1f1a14;
  --ink-soft:     #3b332a;
  --ink-faint:    #6b6052;
  --rule:         #b8a583;
  --rule-soft:    #d8c9a2;
  --accent:       #8c2f1c;
  --accent-2:     #2c5340;
  --gold:         #a37c2a;
  --quote-bg:     #f0e6cd;
  --code-bg:      #efe6ce;
  --code-fg:      #1a140d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Iowan Old Style", "Charter", "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-size: 18px; line-height: 1.7;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 5em; }
.mono, code, pre {
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", Consolas, "Liberation Mono", "Courier New", monospace;
}

main { max-width: 760px; margin: 0 auto; padding: 56px 32px 0; }

/* Masthead */
.masthead {
  text-align: center;
  border-top: 4px double var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 30px 0 22px;
  margin-bottom: 32px;
}
.masthead .kicker {
  font-variant: small-caps;
  letter-spacing: 0.28em;
  font-size: 12px;
  color: var(--accent);
}
.masthead h1 {
  font-size: 40px; line-height: 1.18; margin: 12px 0 8px;
  font-weight: 500;
}
.masthead .deck {
  font-style: italic; color: var(--ink-soft);
  font-size: 18px; max-width: 600px; margin: 0 auto;
}

/* Section openers — Roman numeral between rules */
.chapter-rule {
  text-align: center;
  margin: 56px 0 22px;
  color: var(--accent);
  font-variant: small-caps;
  letter-spacing: 0.3em;
}
.chapter-rule .roman {
  display: inline-block;
  font-size: 20px;
  font-style: italic;
  padding: 0 16px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  line-height: 2;
}
.chapter-title {
  text-align: center;
  font-size: 24px;
  font-style: italic;
  font-weight: 500;
  margin: 0 0 24px;
  color: var(--ink);
}

/* Body prose */
section p { margin: 0 0 1em; color: var(--ink); }
.lede { font-size: 1.08rem; color: var(--ink-soft); }
.lede::first-letter {
  float: left;
  font-size: 4.2em; line-height: 0.9;
  padding: 0.08em 0.1em 0 0;
  color: var(--accent);
  font-weight: 500;
}
.conclusion { color: var(--ink-soft); font-style: italic; }

/* Metric cards (§III 验收 L1 targets) */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  margin: 24px 0;
}
.metric {
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  padding: 18px 20px;
}
.metric .num {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-weight: 600;
  font-size: 2rem; line-height: 1;
  color: var(--ink);
}
.metric .lbl {
  color: var(--ink-faint);
  font-size: 0.72rem; letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 8px;
}
.metric .delta { font-size: 0.78rem; margin-top: 6px; }
.metric .delta-up { color: var(--accent-2); }
.metric .delta-down { color: var(--accent); }
.metric .baseline { color: var(--ink-faint); font-size: 0.78rem; margin-top: 6px; }

/* Callout */
.callout {
  background: var(--paper-2);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  margin: 18px 0;
}
.callout .ctitle {
  font-variant: small-caps;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-size: 12px;
  margin-bottom: 6px;
}
.callout p { margin: 0; }

/* Two-column boundary list (in-scope vs. non-goals).
   Add `.stacked` modifier (`<div class="boundary stacked">`) to switch
   to a single full-width column when bullets are long enough that two
   narrow columns wrap awkwardly. */
.boundary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin: 16px 0;
}
.boundary.stacked { grid-template-columns: 1fr; }
.boundary > div {
  background: var(--paper-2);
  border: 1px solid var(--rule-soft);
  padding: 14px 18px;
}
.boundary h3 {
  margin: 0 0 8px;
  font-size: 0.78rem;
  font-variant: small-caps;
  letter-spacing: 0.12em;
  font-weight: 500;
  color: var(--accent);
}
.boundary ul { margin: 0; padding-left: 1.2em; }
.boundary li { margin: 0.3em 0; }
@media (max-width: 560px) {
  .boundary { grid-template-columns: 1fr; }
}

/* Definition-style table (inputs / dependencies) */
table.inputs {
  width: 100%; border-collapse: collapse;
  font-size: 0.95rem;
  margin: 16px 0;
}
table.inputs th,
table.inputs td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule-soft);
  vertical-align: top;
}
table.inputs th {
  font-variant: small-caps;
  letter-spacing: 0.06em;
  font-weight: 500;
  color: var(--accent);
  font-size: 0.78rem;
  border-bottom: 1px solid var(--rule);
  width: 22%;
}
table.inputs code { background: transparent; padding: 0; color: var(--ink-soft); }

/* Inline elements */
code {
  font-size: 0.88em;
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 0.05rem 0.32rem;
  border-radius: 3px;
}
pre {
  background: var(--code-bg);
  color: var(--code-fg);
  border-left: 3px solid var(--gold);
  padding: 14px 16px;
  overflow-x: auto;
  font-size: 0.92rem;
  margin: 16px 0;
}
pre code { background: transparent; padding: 0; }
a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
ul, ol { padding-left: 1.4em; }
ul li, ol li { margin: 0.35em 0; }

/* Footer */
footer.colophon {
  max-width: 760px; margin: 56px auto 0; padding: 18px 32px 0;
  border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px; letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
</style>
</head>
<body>

<main>

  <header class="masthead">
    <div class="kicker">arc {{ID}} · objective · locked {{DATE}}</div>
    <h1>{{ARC_NAME}}</h1>
    <div class="deck">{{BRIEF}}</div>
  </header>

  <!--
    §I 目标 — One sentence stating the problem to solve. No fuzzy verbs
    ("investigate / explore / take a look"). Concrete verb + concrete object.
    Optional: one short follow-up sentence on motivation / why now.
  -->
  <section>
    <div class="chapter-rule"><span class="roman">I · 目标</span></div>

    <p class="lede"><!-- FILL: 一句话陈述要解决的问题。动词具体。 --></p>
    <!-- FILL (可选): 一句话动机 / 为什么现在做 -->
  </section>

  <!--
    §II 边界 — In-scope vs. non-goals. Both columns required; non-goals are
    just as load-bearing as in-scope.

    Layout: default is two-column. If either side's bullets are long enough
    that two narrow columns wrap awkwardly, switch to stacked (single
    full-width column) by adding the `stacked` modifier:
        <div class="boundary stacked">
  -->
  <section>
    <div class="chapter-rule"><span class="roman">II · 边界</span></div>

    <div class="boundary">
      <div>
        <h3>In-scope</h3>
        <ul>
          <li><!-- FILL --></li>
        </ul>
      </div>
      <div>
        <h3>Non-goals</h3>
        <ul>
          <li><!-- FILL --></li>
        </ul>
      </div>
    </div>
  </section>

  <!--
    §III 验收 — Acceptance criteria.
    L1: quantitative metric cards (target + baseline). Each genuine metric →
    one card. If acceptance is purely visual, delete .metrics and replace with
    a one-liner + link.
    L2: visualization / empirical evidence — bullet list of artifact paths or
    descriptions the user will eyeball at the end.
  -->
  <section>
    <div class="chapter-rule"><span class="roman">III · 验收</span></div>

    <div class="metrics">
      <!-- FILL: 1-N 个 L1 metric 卡片。模板如下，按需复用 / 删除。
      <div class="metric">
        <div class="num">≥ 30.0</div>
        <div class="lbl">PSNR (dB)</div>
        <div class="baseline">baseline 27.4</div>
      </div>
      -->
    </div>

    <div class="callout">
      <div class="ctitle">L2 · 视觉 / 证据</div>
      <ul>
        <li><!-- FILL: artifact path 或 描述 --></li>
      </ul>
    </div>
  </section>

  <!--
    §IV 约束 / 假设 — Only if there are real ones. If none, delete the whole
    section; don't pad with "follow project defaults".
  -->
  <!--
  <section>
    <div class="chapter-rule"><span class="roman">IV · 约束 / 假设</span></div>
    <ul>
      <li>FILL</li>
    </ul>
  </section>
  -->

  <!--
    §V 输入 / 依赖 — Three rows by default (Data / Upstream arc / Main-project
    code). Drop a row if not applicable. Add rows for other external inputs.
  -->
  <section>
    <div class="chapter-rule"><span class="roman">V · 输入 / 依赖</span></div>

    <table class="inputs">
      <tbody>
        <tr><th>Data</th><td><!-- FILL: dataset path / source --></td></tr>
        <tr><th>Upstream arc</th><td><!-- FILL: arc id / doc --></td></tr>
        <tr><th>Main-project code</th><td><!-- FILL: module / file refs --></td></tr>
      </tbody>
    </table>
  </section>

  <!--
    §VI 风险 — Only the genuine ones. Do not invent risks to fill space; if
    there are none worth naming, delete the whole section.
  -->
  <!--
  <section>
    <div class="chapter-rule"><span class="roman">VI · 风险</span></div>
    <ul>
      <li>FILL</li>
    </ul>
  </section>
  -->

</main>

<footer class="colophon">
  <span>arc {{ID}} · objective</span>
  <span>locked {{DATE}}</span>
</footer>

</body>
</html>
