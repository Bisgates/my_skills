<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1_objective — arc {{ID}}</title>

<!--
  /arc-objective: this file is the SKELETON for the locked objective.
  Copy it to <arc>/1_objective.html, then replace tokens and FILL blocks.

  Visual contract = light product-doc theme (Linear/Notion-like), shared with
  templates/9_summary.html:
    - neutral light palette (the :root tokens below — keep them all)
    - macOS system font stack (no Google Fonts)
    - ZERO external CDN (no Tailwind, no KaTeX, no Prism)
    - all CSS inline in this one <style> block

  Tokens: {{ARC_NAME}} {{BRIEF}} {{ID}} {{DATE}}
    ARC_NAME = the arc's brief, prose-cleaned (also used as the <h1>)
    BRIEF    = one-line problem statement, ≤ 18 字 (deck under the title)
    ID       = 7-char arc id (e.g. 260512c)
    DATE     = lock date in YYYY-MM-DD

  Section spine — numbering is FIXED 01-06; when an optional section is
  deleted, do NOT renumber the others:
    01 目标         mandatory; core sentence + flow steps + optional motive.
    02 边界         mandatory; in-scope (prominent) vs. non-goals (dimmed).
    03 验收         mandatory; one Definition-of-Done checklist (L1 + L2).
    04 约束 / 假设   optional; only if there are real ones.
    05 输入 / 依赖   mandatory; mono dependency tree.
    06 风险         optional; only the genuine ones — do not invent risks.

  Write decisions only, not the dialogue transcript. After locking, avoid
  repeated edits; goal changes are expressed via 4_pivot.md or a new arc.
-->

<style>
:root {
  --bg:         #fafafa;
  --card:       #ffffff;
  --border:     #e4e4e7;
  --border-hi:  #d4d4d8;
  --ink:        #18181b;
  --ink-soft:   #3f3f46;
  --ink-faint:  #71717a;
  --accent:     #5b5bd6;
  --accent-bg:  #eeeefc;
  --green:      #16a34a;
  --green-bg:   #ecfdf3;
  --blue:       #0369a1;
  --blue-bg:    #e0f2fe;
  --red:        #dc2626;
  --red-bg:     #fef2f2;
  --code-bg:    #f4f4f5;
  --shadow:     0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.05);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 17.5px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
.mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
main { max-width: 940px; margin: 0 auto; padding: 58px 32px 100px; }

/* Masthead */
.masthead { margin-bottom: 42px; }
.masthead .pills { display: flex; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 500;
  padding: 4px 12px; border-radius: 99px;
  background: var(--accent-bg); color: var(--accent);
}
.pill.neutral { background: var(--code-bg); color: var(--ink-faint); }
.pill .dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.masthead h1 { font-size: 36px; line-height: 1.22; margin: 0 0 9px; font-weight: 650; letter-spacing: -0.022em; }
.masthead .deck { color: var(--ink-faint); font-size: 19px; }

/* Section header */
.sechead { display: flex; align-items: baseline; gap: 11px; margin: 46px 0 16px; }
.sechead .idx { font-size: 15px; font-weight: 600; color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.sechead h2 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }

section p { margin: 0 0 0.85em; }
.motive { color: var(--ink-faint); }

/* §01 目标 — core sentence → flow steps → motive */
.goal-core { font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; line-height: 1.5; margin: 0 0 16px; }
.flow { margin: 0 0 16px; }
.flow .step { display: flex; gap: 14px; align-items: flex-start; position: relative; padding: 0 0 20px; }
.flow .step:last-child { padding-bottom: 0; }
.flow .step::before { content: ""; position: absolute; left: 15px; top: 31px; bottom: 0; width: 2px; background: var(--border); }
.flow .step:last-child::before { display: none; }
.flow .stepnum {
  flex: none; width: 30px; height: 30px; border-radius: 99px;
  background: var(--accent-bg); color: var(--accent); border: 1px solid #d8d8f5;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 650;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  position: relative; z-index: 1;
}
.flow .step-t { font-size: 16.5px; font-weight: 600; color: var(--ink); line-height: 30px; }
.flow .step-d { font-size: 15.5px; color: var(--ink-soft); margin-top: 1px; line-height: 1.6; }

/* Card base */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow); }

/* §02 边界 — 做 prominent / 不做 dimmed, one card; lead phrase bolded */
.scope { padding: 20px 23px; margin: 13px 0; }
.scope h3 { margin: 0 0 10px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.scope .inscope h3 { color: var(--ink); }
.scope .inscope h3::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--green); }
.scope .nongoals { margin-top: 16px; padding: 14px 18px; background: var(--code-bg); border-radius: 8px; }
.scope .nongoals h3 { color: var(--ink-faint); margin-bottom: 6px; font-size: 14px; }
.scope ul { margin: 0; padding: 0; list-style: none; }
.scope .inscope li { padding: 6px 0 6px 28px; position: relative; font-size: 16px; color: var(--ink-soft); }
.scope .inscope li::before { content: "✓"; position: absolute; left: 2px; top: 6px; font-size: 14px; font-weight: 700; color: var(--green); width: 16px; text-align: center; }
.scope .inscope li .lead { font-weight: 650; color: var(--ink); }
.scope .nongoals li { padding: 4px 0 4px 24px; position: relative; font-size: 15px; color: var(--ink-faint); }
.scope .nongoals li::before { content: "✕"; position: absolute; left: 0; top: 4px; font-size: 13px; font-weight: 700; opacity: 0.6; width: 16px; text-align: center; }
.scope .nongoals li .lead { font-weight: 600; color: var(--ink-soft); }

/* §03 验收 — single Definition-of-Done checklist, metric badge inline */
.dod { padding: 18px 21px; margin: 13px 0; }
.dod .dod-head { font-size: 15px; font-weight: 650; color: var(--ink); margin-bottom: 10px; }
.dod ul { margin: 0; padding: 0; list-style: none; }
.dod li { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--code-bg); font-size: 16px; color: var(--ink-soft); }
.dod li .badge {
  flex: none; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 14px; font-weight: 650; color: var(--accent);
  background: var(--accent-bg); border-radius: 6px; padding: 2px 9px;
  min-width: 92px; text-align: center;
}
.dod li .badge.l2 { color: var(--blue); background: var(--blue-bg); }
.dod li .crit { color: var(--ink); font-weight: 550; }
.dod li .sub { color: var(--ink-faint); font-size: 14.5px; }
.dod .divider { font-size: 13.5px; color: var(--ink-faint); letter-spacing: 0.05em; padding: 10px 0 4px; text-transform: uppercase; }

/* §04 约束 — quiet note block, accent left bar, bold lead per row */
.notes { margin: 13px 0; border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; }
.notes .note { padding: 7px 0; font-size: 16px; color: var(--ink-soft); }
.notes .note + .note { border-top: 1px dashed var(--border); }
.notes .note strong { color: var(--ink); }
.notes .note .lead { font-weight: 600; color: var(--ink); margin-right: 6px; }

/* §05 输入 — mono dependency tree */
.deptree { padding: 16px 21px; margin: 13px 0; overflow-x: auto; }
.deptree pre {
  margin: 0; font-size: 14.5px; line-height: 1.75;
  color: var(--ink-soft); background: transparent;
}
.deptree .b { color: var(--border-hi); }              /* branch glyphs ├─ └─ │ */
.deptree .g { color: var(--ink); font-weight: 650; }  /* group name */
.deptree .k { color: var(--ink); font-weight: 550; }  /* item name */
.deptree .p { color: var(--accent); }                 /* path / id */
.deptree .c { color: var(--ink-faint); }              /* trailing comment */

/* §06 风险 — warning rows: risk + 应对 */
.risks { display: grid; gap: 13px; margin: 13px 0; }
.risk { background: var(--card); border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow); padding: 15px 21px; display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.risk .icon { color: var(--red); font-size: 16px; line-height: 1.6; }
.risk .r-what { font-size: 16px; color: var(--ink); font-weight: 550; }
.risk .r-deal { font-size: 15.5px; color: var(--ink-faint); margin-top: 4px; }
.risk .r-deal::before { content: "→ "; color: var(--border-hi); }

code { font-size: 0.86em; background: var(--code-bg); padding: 0.12rem 0.38rem; border-radius: 5px; color: var(--ink-soft); }
a { color: var(--accent); text-decoration: none; }
strong { font-weight: 600; }

footer.colophon {
  max-width: 940px; margin: 0 auto; padding: 18px 32px 50px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12.5px; color: var(--ink-faint);
}
</style>
</head>
<body>

<main>

  <header class="masthead">
    <div class="pills">
      <span class="pill"><span class="dot"></span>arc {{ID}}</span>
      <span class="pill neutral">objective</span>
      <span class="pill neutral">locked {{DATE}}</span>
    </div>
    <h1>{{ARC_NAME}}</h1>
    <div class="deck">{{BRIEF}}</div>
  </header>

  <!--
    01 目标 — Three tiers:
      .goal-core  one sentence, concrete verb + concrete object. No fuzzy
                  verbs ("investigate / explore / take a look").
      .flow       2-4 steps decomposing the core sentence into the pipeline
                  the arc will build/run. Each step = bold title + one-line
                  detail. If the goal is genuinely single-step, delete .flow.
      .motive     optional one-liner: why now. Delete if obvious.
  -->
  <div class="sechead"><span class="idx">01</span><h2>目标</h2></div>
  <section>
    <p class="goal-core"><!-- FILL: 一句话陈述要解决的问题。动词具体。 --></p>
    <div class="flow">
      <div class="step">
        <div class="stepnum">1</div>
        <div>
          <div class="step-t"><!-- FILL: 步骤标题 --></div>
          <div class="step-d"><!-- FILL: 一行细节 --></div>
        </div>
      </div>
      <div class="step">
        <div class="stepnum">2</div>
        <div>
          <div class="step-t"><!-- FILL --></div>
          <div class="step-d"><!-- FILL --></div>
        </div>
      </div>
    </div>
    <p class="motive"><!-- FILL (可选): 动机 / 为什么现在做 --></p>
  </section>

  <!--
    02 边界 — In-scope (prominent, ✓) vs. non-goals (dimmed, ✕), one card,
    serial. Both groups required; non-goals are as load-bearing as in-scope.
    Each bullet starts with <span class="lead">主题词</span> so the list scans
    at a glance — keep the lead to 2-6 字/词.
  -->
  <div class="sechead"><span class="idx">02</span><h2>边界</h2></div>
  <section>
    <div class="card scope">
      <div class="inscope">
        <h3>本 arc 做的事</h3>
        <ul>
          <li><span class="lead"><!-- FILL: 主题词 --></span><!-- FILL: 其余陈述 --></li>
        </ul>
      </div>
      <div class="nongoals">
        <h3>明确不做</h3>
        <ul>
          <li><span class="lead"><!-- FILL: 不做的事 --></span> —— <!-- FILL: 原因 / 留给谁 --></li>
        </ul>
      </div>
    </div>
  </section>

  <!--
    03 验收 — ONE Definition-of-Done checklist; acceptance is a list to tick,
    L1/L2 are attributes of items, not two artifacts.
      L1 rows: .badge = the metric value itself (e.g. "≥ 30.0" / "0 处");
               .crit = what it measures; .sub = baseline in parentheses.
      L2 rows: .badge.l2 = short artifact tag (e.g. "app" / "周报" / "对账");
               .crit = the visual evidence to eyeball.
    If acceptance is purely visual, delete the L1 rows + .divider and keep
    only L2 rows.
  -->
  <div class="sechead"><span class="idx">03</span><h2>验收</h2></div>
  <section>
    <div class="card dod">
      <div class="dod-head">Definition of Done — 全部勾完才算结</div>
      <ul>
        <li>
          <span class="badge"><!-- FILL: 指标值 --></span>
          <span><span class="crit"><!-- FILL: 验收项 --></span> <span class="sub"><!-- FILL (可选): (baseline: …) --></span></span>
        </li>
      </ul>
      <div class="divider">L2 · 视觉 / 证据</div>
      <ul>
        <li>
          <span class="badge l2"><!-- FILL: 短 tag --></span>
          <span class="crit"><!-- FILL: artifact path 或 要核对的证据 --></span>
        </li>
      </ul>
    </div>
  </section>

  <!--
    04 约束 / 假设 — Only if there are real ones. If none, delete the whole
    block; don't pad with "follow project defaults". Each row = bold lead
    (主题词) + statement.
  -->
  <!--
  <div class="sechead"><span class="idx">04</span><h2>约束 / 假设</h2></div>
  <section>
    <div class="notes">
      <div class="note"><span class="lead">FILL 主题词</span>FILL 陈述</div>
    </div>
  </section>
  -->

  <!--
    05 输入 / 依赖 — mono dependency tree rooted at the arc's deliverable.
    Default groups: data / upstream arcs / main-project code; drop a group
    if not applicable, add groups for other external inputs.
    Span classes: .b branch glyphs, .g group, .k item name, .p path/id,
    .c trailing comment. Align name columns with spaces (CJK = 2 cols).
  -->
  <div class="sechead"><span class="idx">05</span><h2>输入 / 依赖</h2></div>
  <section>
    <div class="card deptree">
<pre>
<span class="g"><!-- FILL: 交付物名 --></span>
<span class="b">├─</span> <span class="g">data</span>
<span class="b">│  └─</span> <span class="k"><!-- FILL: 名 --></span> <span class="p"><!-- FILL: 路径 --></span>  <span class="c"><!-- FILL: ← 来源/备注 --></span>
<span class="b">├─</span> <span class="g">upstream arcs</span>
<span class="b">│  └─</span> <span class="p"><!-- FILL: arc id_slug --></span>  <span class="c"><!-- FILL: 备注 --></span>
<span class="b">└─</span> <span class="g">main-project code</span>
<span class="b">   └─</span> <span class="p"><!-- FILL: module / file --></span>  <span class="c"><!-- FILL: 备注 --></span>
</pre>
    </div>
  </section>

  <!--
    06 风险 — Only the genuine ones; do not invent risks to fill space. Each
    risk = .r-what (the risk) + .r-deal (the agreed mitigation). If there are
    none worth naming, delete the whole block.
  -->
  <!--
  <div class="sechead"><span class="idx">06</span><h2>风险</h2></div>
  <section>
    <div class="risks">
      <div class="risk">
        <div class="icon">⚠</div>
        <div>
          <div class="r-what">FILL: 风险</div>
          <div class="r-deal">FILL: 应对</div>
        </div>
      </div>
    </div>
  </section>
  -->

</main>

<footer class="colophon">
  <span>arc {{ID}} · objective</span>
  <span>locked {{DATE}}</span>
</footer>

</body>
</html>
